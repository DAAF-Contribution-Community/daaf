  # bare slug is correct (Kimi K3 / GLM 5.2 precedent); wire_id omitted
  # (comparison defaults to id). Rates are published list prices, provisional
  # until billing reconciliation; day-zero listing warrants a re-check once more
  # providers pick up the slug (a cheaper endpoint appearing later would NOT move
  # this entry without a deliberate re-pin decision).
  #
  # PRICING RECONCILED 2026-08-21: list rates RETAINED
  # (derived/openrouter_reconciliation_2026-08-21.json; combined activity export
  # openrouter_activity_combined_2026-08-21.csv, 39,450 deduped rows; 156 covered
  # runs, billed $61.98, all rows served by Z.AI). obs/pred = 0.33 trips the
  # |obs/pred-1| >= 0.26 review flag, but for a cache-heavy model that is EXPECTED
  # and is NOT a rate-error signal: the DAAFBench cost model does NOT model cache
  # discounts by convention. It is computed on an UNCACHED basis — README
  # § "Battery-cost metric": est_cost is "(input tokens x list input rate + output
  # tokens x list output rate) / 1e6, on an uncached basis (every token at full
  # list rates, no cache discounts ...)"; the reconciler's predictor
  # (reconcile_openrouter_costs.py L556) likewise charges every prompt token at
  # the full input rate and ignores cached_input. Meanwhile 89.4% of GLM 5.3's
  # billed prompt tokens (110.7M of 123.9M) are cache reads that actually bill at
  # cached_input 0.26, so the uncached predictor structurally over-predicts and
  # obs/pred < 1 follows mechanically — it does not indicate a wrong list rate.
  # This mirrors the retained GLM 5.2 precedent at these identical rates (README:
  # "GLM 5.2 obs/pred billing ratio 0.70 (caching benefit from sequential runs)").
  # Provisional marker resolved; rates unchanged.
  - id: "z-ai/glm-5.3"
    name: "GLM 5.3"
    provider: openrouter
    cost_tier: "medium"
    pricing:
      input: 1.40
      output: 4.40
      cached_input: 0.26
    env_overrides:
