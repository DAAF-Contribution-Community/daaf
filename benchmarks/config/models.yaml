      output: 30.00
      cached_input: 0.50
    env_overrides:
      ANTHROPIC_DEFAULT_OPUS_MODEL: "openai/gpt-5.5"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "openai/gpt-5.5"

  # REMOVED 2026-07-10 (user decision after the GPT smoke battery):
  #   gpt-5.6-sol-pro, gpt-5.6-terra-pro, gpt-5.6-luna-pro — all three hit
  #     hard "Prompt is too long" API errors at realistic context sizes via
  #     the OpenRouter Anthropic-compatible endpoint (~4x inflated token
  #     accounting vs non-pro against a ~200k ceiling; P4 perfect-rate 0 for
  #     all three). Full evidence: research/2026-07-09_FrameworkDev_
  #     GPTBenchSmoke/SESSION_NOTES.md Issue #9.
  #   gpt-5.5-pro — never run: premium pricing ($30/$180 per M, no cache
  #     discount) projected a $400+ battery, and the pro-wall likely applies.
  # RETEST 2026-07-10 (research/2026-07-10_FrameworkDev_ShimToolSanitization/
  #   poc/01_pro_wall_probe.py, via OpenRouter's OPENAI-format endpoint —
  #   the wire format the DAAF provider shim uses): NO hard wall there
  #   (sol-pro accepted a ~250k-token prompt, HTTP 200), so the "Prompt is
  #   too long" ceiling is specific to the Anthropic-compat endpoint. BUT
  #   the token-accounting inflation is intrinsic to the pro slugs: 4.01x
  #   the prompt tokens of non-pro sol on byte-identical input (668,328 vs
  #   166,711). Same listed per-token price x 4x tokens = ~4x effective
  #   cost. Removal stands for both lanes: hard-broken on anthropic-compat,
  #   economically irrational via the shim unless a future benchmark shows
  #   pro-tier quality worth 4x.

  - id: "openai/gpt-5.4-mini"
    name: "GPT-5.4 Mini"
    provider: openrouter
    cost_tier: "low"
    pricing:
      input: 0.75
      output: 4.50
      cached_input: 0.075
    env_overrides:
      ANTHROPIC_DEFAULT_OPUS_MODEL: "openai/gpt-5.4-mini"
