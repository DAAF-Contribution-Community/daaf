      ANTHROPIC_DEFAULT_SONNET_MODEL: "openai/gpt-5.6-terra"

  - id: "openai/gpt-5.6-luna"
    name: "GPT-5.6 Luna"
    provider: openrouter
    cost_tier: "medium"
    pricing:
      input: 1.00
      output: 6.00
      cached_input: 0.10
    env_overrides:
      ANTHROPIC_DEFAULT_OPUS_MODEL: "openai/gpt-5.6-luna"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "openai/gpt-5.6-luna"

  # --- OpenAI GPT models (deployed ChatGPT-subscription shim path) ---
  # This is a system/deployment benchmark condition, not a raw-model lane:
  # tool sanitization remains enabled and is captured by route provenance.
  - key: "gpt-56-luna-chatgpt"
    id: "gpt-5.6-luna"
    name: "GPT-5.6 Luna (ChatGPT Subscription)"
    provider: "chatgpt-subscription"
    cost_tier: "medium"
    effort_level: "high"
    # context_window_tokens feeds CLAUDE_CODE_MAX_CONTEXT_TOKENS in the benchmark
    # child environment (harness/executor.py), so on the chatgpt-subscription lane
    # it must reflect the lane's effective INPUT ceiling, not the model's true 1M
    # API-route window. The Codex backend ceiling was measured ~370000 for
    # gpt-5.6-sol (2026-07-16: accept 369,941, reject 372,905); Luna is UNMEASURED
    # on this lane and is conservatively assumed lane-capped the same way, matching
    # the statusline/hook lane-gate policy. Re-measure with
    # scripts/provider_shim/probe_context_ceiling.py and raise if Luna proves higher.
    context_window_tokens: 370000
    actual_billing_treatment: "not_separately_billed"
    api_equivalent_pricing:
      source_url: "https://developers.openai.com/api/docs/models/gpt-5.6-luna"
      accessed_at: "2026-07-15"
      threshold_input_tokens: 272000
      short_context:
        input: 1.00
        cached_input: 0.10
        cache_write: 1.25
        output: 6.00
      long_context:
        input: 2.00
        cached_input: 0.20
        cache_write: 2.50
        output: 9.00
    env_overrides:
      ANTHROPIC_DEFAULT_OPUS_MODEL: "gpt-5.6-luna"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "gpt-5.6-luna"
      CLAUDE_CODE_SUBAGENT_MODEL: "gpt-5.6-luna"

  - id: "openai/gpt-5.5"
    name: "GPT-5.5"
    provider: openrouter
    cost_tier: "medium"
    pricing:
