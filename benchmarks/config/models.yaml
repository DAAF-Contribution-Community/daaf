# Model matrix for DAAF Framework Adherence Benchmarks
#
# Each entry defines a model configuration to benchmark.
# key: optional explicit selectable registry key; entries without it retain the
#      historical name-derived key for backward compatibility.
# provider: "anthropic" (default), "openrouter", or "chatgpt-subscription" —
#           controls env var wiring.
# env_overrides are passed as environment variables to the claude CLI;
# provider-level overrides are injected automatically by model_loader.py.
#
# CHILD-MODEL PURITY PINNING (added 2026-07-24, updated 2026-07-27).
# Model entries pin child-model selectors to their own ids so benchmark-dispatched
# children remain on the model under test. Most entries use all three selectors:
#     ANTHROPIC_DEFAULT_OPUS_MODEL / ANTHROPIC_DEFAULT_SONNET_MODEL /
#     CLAUDE_CODE_SUBAGENT_MODEL
# The three GPT 5.6 ChatGPT-subscription entries intentionally use ONLY the Opus
# and Sonnet aliases. Both aliases resolve to that entry's own parent GPT id, while
# CLAUDE_CODE_SUBAGENT_MODEL is absent because its higher-precedence flattening
# would bypass the semantic tier selected by agent frontmatter. The executor
# scrubs that selector from the ambient environment before applying model-specific
# overrides, so omission here is effective while entries that explicitly declare
# the selector retain it. This two-alias configuration preserves operative
# opus/sonnet tier selection while remaining model-pure because both tiers resolve
# to the same benchmarked GPT model.
#
# WHY: since commit a6cf8e2 (2026-07-16) DAAF agent frontmatter declares
# model: opus/sonnet TIERS, so dispatched children no longer inherit the session
# model — they resolve to whatever those tier aliases point at. The B2 purity gate
# (harness/artifacts.py) then marks off-model runs validity: invalid and EXCLUDES
# them from every score rollup (observed: the 2026-07-23 Fable dc pass, 6/6 runs
# "Child model purity: failed"). Pinning the applicable selectors to the entry's
# own id restores children == parent, which is both purity-valid and faithful to
# the original June inheritance condition (VERIFIED: both June Fable dc sets'
# archived child transcripts are 100% claude-fable-5, 312 + 322 assistant msgs).
#
# CONDITION NOTE: this makes "children = the benchmarked model" an explicit,
# uniform condition. It is NOT DAAF's live two-tier production routing (where
# the two tiers can resolve to different models). That is the deliberate
# purity-gate tradeoff. Archived results predating this edit are unaffected.
#
# MERGE SEMANTICS (verified in harness/model_loader.py:106-114):
#   openrouter/anthropic -> {**resolved, **config.env_overrides}  (YAML wins)
#   chatgpt-subscription -> {**config.env_overrides, **resolved}  (resolved wins)
# The chatgpt reversal is SAFE for these pins: build_chatgpt_child_env()
# (harness/route_provenance.py:151-168) returns only ANTHROPIC_BASE_URL,
# ANTHROPIC_AUTH_TOKEN, and ANTHROPIC_API_KEY — no *_MODEL selector — so the
# YAML tier-alias pins survive the fail-closed route overlay intact.
#
# pricing: per-million-token rates for pre-run cost estimation.
#   input:        $/M input tokens
#   output:       $/M output tokens
#   cached_input: $/M cached input tokens (omit if provider doesn't discount)
#
# api_equivalent_pricing: dated, counterfactual list-price schedule for a
# subscription route. It is not the run's actual bill and is never fed into the
# legacy pricing calculation.
#
# Anthropic pricing updated from platform.claude.com/docs on 2026-06-08.
# OpenRouter pricing pulled from /api/v1/models on 2026-06-08.

