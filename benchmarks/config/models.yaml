  # --- OpenAI GPT models (via OpenRouter Anthropic-compatible endpoint) ---
  #
  # Added 2026-07-09 for GPT smoke-test battery. Pricing pulled live from
  # OpenRouter /api/v1/models on 2026-07-09 (cached_input = 10% of input,
  # except gpt-5.5-pro which lists no cache discount).
  #
  # env_overrides remap BOTH tier aliases to the model under test so that
  # subagent dispatches stay model-pure: agent frontmatter now declares
  # model: opus/sonnet tiers (commit 1f9103c, 2026-07-05), and without the
  # remaps the enforce-model-ceiling hook denies Claude-tier requests on
  # non-Claude sessions. With the remaps set, the hook stands down (rule b)
  # and every resolution path lands on the tested model — live-verified via
  # research/2026-07-09_FrameworkDev_GPTBenchSmoke/poc/01_dual_tier_remap_probe.sh
  # (both search-agent and research-executor subagents ran on the session model).
  #
  # NOTE: the gpt-5.6 -pro variants and gpt-5.5-pro were removed on
  # 2026-07-10 after the smoke battery — see the REMOVED block below the
  # GPT-5.5 entry for the evidence trail.
  #
  # SHIM LANE CONDITION (updated 2026-07-15): sanitizer state depends on the
  # experiment. Raw-model experiments require sanitizer-off provenance. The
  # deployed-path ChatGPT-subscription experiment intentionally measures normal
  # DAAF behavior with SHIM_SANITIZE_TOOLS=1 and fails closed unless /health
  # confirms sanitize_tools=true. In either case daemon state is an experimental
  # condition: model env_overrides reach only the benchmark child and cannot
  # alter a running shim. OpenRouter entries bypass the shim.

  - id: "openai/gpt-5.6-sol"
    name: "GPT-5.6 Sol"
    provider: openrouter
    cost_tier: "medium"
    pricing:
      input: 5.00
      output: 30.00
      cached_input: 0.50
    env_overrides:
      ANTHROPIC_DEFAULT_OPUS_MODEL: "openai/gpt-5.6-sol"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "openai/gpt-5.6-sol"

  - id: "openai/gpt-5.6-terra"
    name: "GPT-5.6 Terra"
    provider: openrouter
    cost_tier: "medium"
    pricing:
