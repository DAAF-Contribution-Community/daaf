# --- Retired display exclusions (drop a model from ALL report surfaces) ---
# Model NAMES (matching run.model / the retired `name:` field) whose corpus
# runs must be dropped from EVERY display surface of the results viewer —
# leaderboard, cost/battery, Key Takeaways aggregation, run counts, scatter,
# consistency. This is quarantine-equivalent at model granularity: the runs
# stay immutable on disk (rescoreable), but the generator excludes them at
# load time (load_display_exclusions() -> load_runs chokepoint in
# scripts/generate_results_viewer_v2.py). Use this when a model has been
# retired and the maintainer wants it fully gone from the report rather than
# shown as archived history (contrast retired_model_pricing below, which KEEPS
# a retired model visible and merely preserves its list rates). Ignored by the
# harness and phase runners (they read only `models:`).
retired_display_exclusions:
  # 2026-08-21: Qwen 3.8 2.4T A95B exclusion LIFTED. Its real 3-rep battery
  # (results/20260820_155004_75b785) landed, and the 2026-08-12..14 stray
  # single-rep dc-01 onboarding probes that had distorted the leaderboard were
  # quarantined 2026-08-21 (_quarantine_2026-08-21_dc01surplus_*, runs
  # preserved). The model now satisfies the exactly-3 corpus contract and
  # returns to all display surfaces.
  # 2026-08-11: the pre-0731 (undated) DeepSeek V4 Flash is fully removed from
  # the report. It was retired from `models:` on 2026-08-02 (superseded by the
  # DeepSeek V4 Flash 0731 revision, see the REMOVED block above); per user
  # decision its corpus history is now excluded from display entirely rather
  # than carried as archived cost history. Runs remain on disk untouched.
  - "DeepSeek V4 Flash"

