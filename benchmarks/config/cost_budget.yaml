# Cost budget configuration for DAAF Framework Adherence Benchmarks
#
# The runner will halt execution if any budget limit is exceeded.

# Maximum cost for a single test case run (USD)
max_cost_per_run: 15.00

# Maximum total cost for an entire benchmark suite (USD)
max_cost_per_suite: 500.00

# Maximum total cost across all suites in a session (USD)
max_cost_per_session: 1000.00

# Number of repetitions per test case per model (for pass@k)
# Uniform across all models and cost tiers by default.
# Override at the CLI with --reps N.
default_repetitions: 3

# Override repetitions for specific cost tiers (disabled — uniform reps preferred)
# repetitions_by_tier:
#   low: 3
#   medium: 3
#   high: 3
