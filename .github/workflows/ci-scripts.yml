# CI: Shell & PowerShell Script Quality
#
# Validates all .sh and .ps1 scripts across the repository.
# Companion workflow: ci-integration.yml runs Docker integration tests weekly.
#
# Nine jobs:
#   1. lint-bash           - ShellCheck on all .sh files (ubuntu)
#   2. lint-powershell     - PSScriptAnalyzer on all .ps1 files (ubuntu/pwsh 7)
#   3. hygiene-checks      - Executable bits, LF endings, script pair parity
#   4. validate-ps-windows - PSScriptAnalyzer on Windows PowerShell 5.1
#   5. bats-tests          - BATS unit/smoke tests for .sh scripts (ubuntu)
#   6. pester-tests        - Pester tests for .ps1 scripts (ubuntu + windows)
#   7. daaf-conventions    - Custom DAAF-specific lint checks (ubuntu)
#   8. smoke-tests         - Cross-platform dry-run smoke tests (ubuntu + macos + windows)
#   9. bats-bash32         - Host-script BATS suite under real Bash 3.2 (ubuntu container)
#
# Triggered only when shell-related files change (path filtering).

name: CI - Scripts

on:
  push:
    paths:
      - '**.sh'
      - '**.ps1'
      - '**.bats'
      - '**/*.Tests.ps1'
      - '.github/workflows/ci-scripts.yml'
      - '.github/linters/**'
      - 'tests/lint/**'
  pull_request:
    paths:
      - '**.sh'
      - '**.ps1'
      - '**.bats'
      - '**/*.Tests.ps1'
      - 'tests/lint/**'
      - '.github/workflows/ci-scripts.yml'
      - '.github/linters/**'

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Job 1: Lint all Bash scripts with ShellCheck
# ---------------------------------------------------------------------------
jobs:
  lint-bash:
    name: ShellCheck (Bash)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ShellCheck is pre-installed on ubuntu-latest runners.
      # We invoke it directly to scan all .sh files across multiple
      # directories (root, .claude/hooks/, .claude/scripts/, scripts/).
      - name: Run ShellCheck on all .sh files
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -x --severity=warning --shell=bash --format=gcc

  # ---------------------------------------------------------------------------
  # Job 2: Lint all PowerShell scripts with PSScriptAnalyzer (pwsh 7 on Linux)
  # ---------------------------------------------------------------------------
  lint-powershell:
    name: PSScriptAnalyzer (pwsh 7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pwsh is pre-installed on ubuntu-latest runners.
      # We install PSScriptAnalyzer and run it with the repo's config file.
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./.github/linters/PSScriptAnalyzerSettings.psd1 | Format-Table -AutoSize
          $failCount = (Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./.github/linters/PSScriptAnalyzerSettings.psd1).Count
          if ($failCount -gt 0) { exit 1 }

  # ---------------------------------------------------------------------------
  # Job 3: Hygiene checks (executable bits, line endings, script pair parity)
  # ---------------------------------------------------------------------------
  hygiene-checks:
    name: Hygiene Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Verify every tracked .sh file has Git executable mode (100755).
      # Scripts without the executable bit will fail in Docker and on Linux.
      - name: Verify executable bits on .sh files
        run: |
          echo "Checking that all tracked .sh files have mode 100755..."
          bad_files=$(git ls-files -s '*.sh' | awk '$1 != "100755" { print $4 }')
          if [ -n "$bad_files" ]; then
            echo "ERROR: The following .sh files are NOT executable (mode 100644):"
            echo "$bad_files"
            echo ""
            echo "Fix with: chmod +x <file> && git update-index --chmod=+x <file>"
            exit 1
          fi
          echo "All .sh files have correct executable bits."

      # Verify no CRLF line endings have crept into shell or PowerShell scripts.
      # .gitattributes enforces LF globally, but this catches pre-existing files.
      - name: Verify LF line endings
        run: |
          echo "Checking for CRLF line endings in .sh and .ps1 files..."
          # -P enables Perl regex for \r; -l lists matching filenames
          crlf_files=$(find . -name '*.sh' -o -name '*.ps1' | grep -v './.git/' | xargs grep -Pl '\r$' 2>/dev/null || true)
          if [ -n "$crlf_files" ]; then
            echo "ERROR: The following files contain CRLF line endings:"
            echo "$crlf_files"
            echo ""
            echo "Fix with: git add --renormalize . && git commit"
            exit 1
          fi
          echo "All script files have LF line endings."

      # Verify that every host lifecycle .sh has a matching .ps1 (and vice versa).
      # DAAF maintains matched pairs for cross-platform support.
      - name: Verify script pair parity (sh/ps1)
        run: |
          echo "Checking scripts/host/ script pair parity..."
          exit_code=0

          # Check each host .sh has a matching .ps1
          for sh_file in ./scripts/host/*.sh; do
            [ -f "$sh_file" ] || continue
            base=$(basename "$sh_file" .sh)
            if [ ! -f "./scripts/host/${base}.ps1" ]; then
              echo "ERROR: ${sh_file} has no matching ${base}.ps1"
              exit_code=1
            fi
          done

          # Check each host .ps1 has a matching .sh
          for ps_file in ./scripts/host/*.ps1; do
            [ -f "$ps_file" ] || continue
            base=$(basename "$ps_file" .ps1)
            if [ ! -f "./scripts/host/${base}.sh" ]; then
              echo "ERROR: ${ps_file} has no matching ${base}.sh"
              exit_code=1
            fi
          done

          if [ "$exit_code" -eq 0 ]; then
            echo "All scripts/host/ scripts have matching cross-platform pairs."
          fi
          exit $exit_code

  # ---------------------------------------------------------------------------
  # Job 4: Validate PowerShell scripts on Windows PowerShell 5.1
  # ---------------------------------------------------------------------------
  validate-ps-windows:
    name: PSScriptAnalyzer (Windows PS 5.1)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Windows PowerShell 5.1 (not pwsh) is the default shell on Windows.
      # This catches compatibility issues between PS 7 and PS 5.1.
      - name: Run PSScriptAnalyzer (Windows PS 5.1)
        shell: powershell
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./.github/linters/PSScriptAnalyzerSettings.psd1 | Format-Table -AutoSize
          $failCount = (Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./.github/linters/PSScriptAnalyzerSettings.psd1).Count
          if ($failCount -gt 0) { exit 1 }

  # ---------------------------------------------------------------------------
  # Job 5: Run BATS tests for Bash scripts
  # ---------------------------------------------------------------------------
  bats-tests:
    name: BATS Tests (Bash)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install BATS and helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      # Run all .bats test files. The test helper includes fallback
      # assertions so tests work without bats-support/bats-assert submodules.
      - name: Run BATS tests
        run: bats tests/bash/

  # ---------------------------------------------------------------------------
  # Job 6: Run Pester tests for PowerShell scripts
  # ---------------------------------------------------------------------------
  pester-tests:
    name: Pester Tests (PowerShell)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pester 5.x is pre-installed on GitHub-hosted runners.
      - name: Run Pester tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./tests/powershell/ -CI -Output Detailed

  # ---------------------------------------------------------------------------
  # Job 7: DAAF-specific convention checks
  # ---------------------------------------------------------------------------
  daaf-conventions:
    name: DAAF Conventions Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run DAAF convention checks
        run: bash tests/lint/check-daaf-conventions.sh

  # ---------------------------------------------------------------------------
  # Job 8: Cross-platform dry-run smoke tests (no Docker needed)
  # ---------------------------------------------------------------------------
  # Verifies that all lifecycle scripts load and run their full logic paths
  # on all three OS platforms using DAAF_DRY_RUN=1 (mocked Docker/curl).
  # Catches bash 3.2 incompatibilities (macOS), PS 5.1 quirks (Windows),
  # unresolved variable references, and control flow errors.
  #
  # Bash script coverage: install, backup, rebuild, update, migrate,
  # restore_from_backup, view_logs, view_notebooks, view_quarto, run_vscode,
  # run_daaf, and daaf.sh (the Control Panel). daaf.sh is the interactive menu entry point and
  # runs a persistent loop, so on macOS it is driven separately (see the
  # macOS-only step below) with `q` on stdin and a seeded backup dir — this
  # forces the gather_status last-backup code path that was historically fatal
  # under Bash 3.2 (negative array subscript). The bats-bash32 job (below) runs
  # the full host-script bats suite under real Bash 3.2 for deterministic,
  # non-macOS-runner coverage of the same class of defect.
  smoke-tests:
    name: Smoke Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bash smoke tests (Linux/macOS only — Git Bash on Windows is unreliable
      # for complex scripts with function overrides and subshells).
      # Each script is run individually to capture output and verify both exit
      # code and content (the [DRY-RUN] marker plus script-specific strings).
      - name: Smoke test .sh scripts (dry-run)
        if: matrix.os != 'windows-latest'
        run: |
          failed=0

          assert_contains() {
            local label="$1" output="$2" pattern="$3"
            if echo "$output" | grep -qF "$pattern"; then
              echo "  PASS: output contains '$pattern'"
            else
              echo "  FAIL: expected output to contain '$pattern'"
              failed=1
            fi
          }

          # --- install.sh ---
          echo "=== Smoke testing: scripts/host/install.sh ==="
          out=$(DAAF_DRY_RUN=1 DAAF_NESTED=1 bash scripts/host/install.sh 2>&1) || { echo "FAILED: install.sh (exit code $?)"; failed=1; }
          assert_contains "install.sh" "$out" "[DRY-RUN]"
          assert_contains "install.sh" "$out" "DAAF Installer"
          assert_contains "install.sh" "$out" "Installation complete!"

          # --- backup_daaf.sh ---
          echo "=== Smoke testing: scripts/host/backup_daaf.sh ==="
          out=$(DAAF_DRY_RUN=1 DAAF_NESTED=1 bash scripts/host/backup_daaf.sh 2>&1) || { echo "FAILED: backup_daaf.sh (exit code $?)"; failed=1; }
          assert_contains "backup_daaf.sh" "$out" "[DRY-RUN]"
          assert_contains "backup_daaf.sh" "$out" "DAAF Backup"
          assert_contains "backup_daaf.sh" "$out" "[DRY-RUN] Would create backup at:"

          # --- rebuild_daaf.sh ---
          echo "=== Smoke testing: scripts/host/rebuild_daaf.sh ==="
          out=$(DAAF_DRY_RUN=1 DAAF_NESTED=1 bash scripts/host/rebuild_daaf.sh 2>&1) || { echo "FAILED: rebuild_daaf.sh (exit code $?)"; failed=1; }
          assert_contains "rebuild_daaf.sh" "$out" "DAAF Rebuild"
          assert_contains "rebuild_daaf.sh" "$out" "Rebuild complete!"

          # --- update_daaf.sh ---
          echo "=== Smoke testing: scripts/host/update_daaf.sh ==="
          out=$(DAAF_DRY_RUN=1 DAAF_NESTED=1 bash scripts/host/update_daaf.sh 2>&1) || { echo "FAILED: update_daaf.sh (exit code $?)"; failed=1; }
          assert_contains "update_daaf.sh" "$out" "DAAF Updater"
          assert_contains "update_daaf.sh" "$out" "Already up to date!"

          # --- migrate_daaf.sh ---
          echo "=== Smoke testing: scripts/host/migrate_daaf.sh ==="
          out=$(DAAF_DRY_RUN=1 DAAF_NESTED=1 bash scripts/host/migrate_daaf.sh 2>&1) || { echo "FAILED: migrate_daaf.sh (exit code $?)"; failed=1; }
          assert_contains "migrate_daaf.sh" "$out" "[DRY-RUN]"
          assert_contains "migrate_daaf.sh" "$out" "DAAF Migration"
          assert_contains "migrate_daaf.sh" "$out" "Migration complete!"

          # --- restore_from_backup.sh ---
          echo "=== Smoke testing: scripts/host/restore_from_backup.sh ==="
          out=$(DAAF_DRY_RUN=1 DAAF_NESTED=1 bash scripts/host/restore_from_backup.sh 2>&1) || { echo "FAILED: restore_from_backup.sh (exit code $?)"; failed=1; }
          assert_contains "restore_from_backup.sh" "$out" "DAAF Restore from Backup"
          assert_contains "restore_from_backup.sh" "$out" "Restore dry-run complete!"

          # --- view_logs.sh ---
          echo "=== Smoke testing: scripts/host/view_logs.sh ==="
          out=$(DAAF_DRY_RUN=1 DAAF_NESTED=1 bash scripts/host/view_logs.sh 2>&1) || { echo "FAILED: view_logs.sh (exit code $?)"; failed=1; }
          assert_contains "view_logs.sh" "$out" "DAAF container is running."
          assert_contains "view_logs.sh" "$out" "Opening DAAF Log Explorer"

          # --- view_notebooks.sh ---
          echo "=== Smoke testing: scripts/host/view_notebooks.sh ==="
          out=$(DAAF_DRY_RUN=1 DAAF_NESTED=1 bash scripts/host/view_notebooks.sh 2>&1) || { echo "FAILED: view_notebooks.sh (exit code $?)"; failed=1; }
          assert_contains "view_notebooks.sh" "$out" "DAAF container is running."
          assert_contains "view_notebooks.sh" "$out" "Opening DAAF Notebook Browser"

          # --- view_quarto.sh ---
          echo "=== Smoke testing: scripts/host/view_quarto.sh ==="
          out=$(DAAF_DRY_RUN=1 DAAF_NESTED=1 bash scripts/host/view_quarto.sh 2>&1) || { echo "FAILED: view_quarto.sh (exit code $?)"; failed=1; }
          assert_contains "view_quarto.sh" "$out" "DAAF container is running."
          assert_contains "view_quarto.sh" "$out" "Discovering Quarto notebooks under research/"

          # --- run_vscode.sh ---
          echo "=== Smoke testing: scripts/host/run_vscode.sh ==="
          out=$(DAAF_DRY_RUN=1 DAAF_NESTED=1 bash scripts/host/run_vscode.sh 2>&1) || { echo "FAILED: run_vscode.sh (exit code $?)"; failed=1; }
          assert_contains "run_vscode.sh" "$out" "DAAF container is running."
          assert_contains "run_vscode.sh" "$out" "Opening DAAF Code Browser"

          # --- run_daaf.sh ---
          echo "=== Smoke testing: scripts/host/run_daaf.sh ==="
          out=$(DAAF_DRY_RUN=1 DAAF_NESTED=1 bash scripts/host/run_daaf.sh 2>&1) || { echo "FAILED: run_daaf.sh (exit code $?)"; failed=1; }
          assert_contains "run_daaf.sh" "$out" "[DRY-RUN]"
          assert_contains "run_daaf.sh" "$out" "DAAF container is already running."
          assert_contains "run_daaf.sh" "$out" "Launching Claude Code"

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "One or more smoke tests failed."
            exit 1
          fi
          echo ""
          echo "All bash smoke tests passed."

      # daaf.sh Control Panel smoke test under macOS system Bash 3.2.
      #
      # Why macOS-only and why /bin/bash explicitly: macOS ships GNU Bash
      # 3.2.57 at /bin/bash (Apple will not ship a GPLv3 build), and the
      # documented launch is `bash daaf.sh`. GitHub macOS runners may have a
      # newer Homebrew bash earlier in PATH, so `bash` alone would NOT reproduce
      # the 3.2 environment — we invoke /bin/bash by absolute path to pin 3.2.
      #
      # Why this is a separate step: daaf.sh is the interactive Control Panel,
      # not a run-once lifecycle script. It runs a persistent menu loop, so it
      # must be driven with a choice on stdin (`q` to quit) rather than exiting
      # on its own. It also requires docker-compose.yml in the working directory
      # (repo root — present after checkout) for its preflight.
      #
      # Why seed a backup dir: the Bash-3.2-fatal path is gather_status's
      # last-backup lookup, which only executes when a *_daaf_backup directory
      # exists (otherwise the glob does not match and the line is skipped). A
      # clean checkout has none, so we create one to force that code path to run
      # under 3.2. DAAF_DRY_RUN=1 mocks Docker (consistent with the smoke entries
      # above and tests/bash/daaf.bats), so no Docker daemon is needed.
      - name: Smoke test daaf.sh Control Panel (macOS Bash 3.2)
        if: matrix.os == 'macos-latest'
        run: |
          echo "Bash version at /bin/bash:"
          /bin/bash --version | head -1

          # Seed a fake backup dir so gather_status's last-backup path executes.
          mkdir -p ./2026-06-18_daaf_backup

          echo "=== Smoke testing: scripts/host/daaf.sh (Control Panel) ==="
          # Feed 'q' to quit the menu loop after the first draw. gather_status
          # (which contains the historically fatal negative-subscript line) runs
          # before the menu is displayed, so a single iteration exercises it.
          out=$(printf 'q\n' | DAAF_DRY_RUN=1 /bin/bash scripts/host/daaf.sh 2>&1) || {
            echo "FAILED: daaf.sh (exit code $?)"
            echo "$out"
            rm -rf ./2026-06-18_daaf_backup
            exit 1
          }

          rm -rf ./2026-06-18_daaf_backup

          failed=0
          if echo "$out" | grep -qF "DAAF Control Panel"; then
            echo "  PASS: output contains 'DAAF Control Panel'"
          else
            echo "  FAIL: expected output to contain 'DAAF Control Panel'"
            failed=1
          fi
          if echo "$out" | grep -qF "Goodbye!"; then
            echo "  PASS: output contains 'Goodbye!' (clean menu exit)"
          else
            echo "  FAIL: expected output to contain 'Goodbye!'"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "daaf.sh smoke test failed."
            echo "--- captured output ---"
            echo "$out"
            exit 1
          fi
          echo ""
          echo "daaf.sh Control Panel smoke test passed under Bash 3.2."

      # PowerShell 7 smoke tests (all platforms — pwsh is pre-installed).
      # Each script is run individually to capture output and verify both exit
      # code and content (the [DRY-RUN] marker plus script-specific strings).
      - name: Smoke test .ps1 scripts (dry-run, pwsh 7)
        shell: pwsh
        run: |
          $failed = 0

          function Assert-OutputContains {
            param([string]$Label, [string]$Output, [string]$Pattern)
            if ($Output -match [regex]::Escape($Pattern)) {
              Write-Host "  PASS: output contains '$Pattern'"
            } else {
              Write-Host "  FAIL: expected output to contain '$Pattern'"
              $script:failed = 1
            }
          }

          function Invoke-SmokeTest {
            param(
              [string]$ScriptPath,
              [string[]]$ExpectedStrings
            )
            $name = Split-Path $ScriptPath -Leaf
            Write-Host "=== Smoke testing: $name ==="
            $env:DAAF_DRY_RUN = "1"
            $env:DAAF_NESTED = "1"
            try {
              $output = & $ScriptPath *>&1 | Out-String
              if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
                Write-Host "FAILED: $name (exit code $LASTEXITCODE)"
                $script:failed = 1
              }
            } catch {
              Write-Host "FAILED: $name - $_"
              $script:failed = 1
              return
            }
            foreach ($pattern in $ExpectedStrings) {
              Assert-OutputContains $name $output $pattern
            }
          }

          Invoke-SmokeTest "scripts/host/install.ps1" @(
            "DAAF Installer",
            "Installation complete!"
          )

          Invoke-SmokeTest "scripts/host/backup_daaf.ps1" @(
            "[DRY-RUN]",
            "DAAF Backup",
            "[DRY-RUN] Would copy"
          )

          Invoke-SmokeTest "scripts/host/rebuild_daaf.ps1" @(
            "DAAF Rebuild",
            "Rebuild complete!"
          )

          Invoke-SmokeTest "scripts/host/update_daaf.ps1" @(
            "DAAF Updater",
            "Already up to date!"
          )

          Invoke-SmokeTest "scripts/host/migrate_daaf.ps1" @(
            "DAAF Migration",
            "Migration complete!"
          )

          Invoke-SmokeTest "scripts/host/restore_from_backup.ps1" @(
            "DAAF Restore from Backup",
            "Restore dry-run complete!"
          )

          Invoke-SmokeTest "scripts/host/view_logs.ps1" @(
            "DAAF container is running.",
            "Opening DAAF Log Explorer"
          )

          Invoke-SmokeTest "scripts/host/view_notebooks.ps1" @(
            "DAAF container is running.",
            "Opening DAAF Notebook Browser"
          )

          Invoke-SmokeTest "scripts/host/view_quarto.ps1" @(
            "DAAF container is running.",
            "Discovering Quarto notebooks under research/"
          )

          Invoke-SmokeTest "scripts/host/run_vscode.ps1" @(
            "DAAF container is running.",
            "Opening DAAF Code Browser"
          )

          Invoke-SmokeTest "scripts/host/run_daaf.ps1" @(
            "DAAF container is already running.",
            "Launching Claude Code"
          )

          # daaf.ps1 Control Panel: interactive menu loop, so it is driven
          # separately (like daaf.sh) with `q` on stdin to quit after the first
          # menu draw. Seed a backup dir so Get-DaafStatus's last-backup path
          # executes, and require docker-compose.yml (repo root after checkout)
          # for the preflight. DAAF_DRY_RUN=1 mocks Docker.
          #
          # IMPORTANT: spawn a CHILD PROCESS via -NoProfile -File so that piped
          # input reaches [Console]::In (stdin) inside daaf.ps1. Piping into an
          # in-process `& script.ps1` feeds the PS pipeline, NOT stdin, so
          # Read-DaafLine's [Console]::In.ReadLine() would block waiting for
          # real terminal input and hang the job.
          Write-Host "=== Smoke testing: scripts/host/daaf.ps1 (Control Panel) ==="
          New-Item -ItemType Directory -Path "./2026-06-18_daaf_backup" -Force | Out-Null
          $env:DAAF_DRY_RUN = "1"
          Remove-Item Env:\DAAF_NESTED -ErrorAction SilentlyContinue
          $panelOut = "q" | & pwsh -NoProfile -File scripts/host/daaf.ps1 2>&1 | Out-String
          Remove-Item -Recurse -Force "./2026-06-18_daaf_backup" -ErrorAction SilentlyContinue
          Assert-OutputContains "daaf.ps1" $panelOut "DAAF Control Panel"
          Assert-OutputContains "daaf.ps1" $panelOut "Goodbye!"

          if ($failed) {
            Write-Host ""
            Write-Host "One or more smoke tests failed."
            exit 1
          }
          Write-Host ""
          Write-Host "All pwsh 7 smoke tests passed."

      # Windows PowerShell 5.1 smoke test (Windows only — catches PS 5.1
      # $ErrorActionPreference quirks, alias differences, and path issues).
      # Each script is run individually to capture output and verify both exit
      # code and content (the [DRY-RUN] marker plus script-specific strings).
      - name: Smoke test .ps1 scripts (dry-run, Windows PS 5.1)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $failed = 0

          function Assert-OutputContains {
            param([string]$Label, [string]$Output, [string]$Pattern)
            if ($Output -match [regex]::Escape($Pattern)) {
              Write-Host "  PASS: output contains '$Pattern'"
            } else {
              Write-Host "  FAIL: expected output to contain '$Pattern'"
              $script:failed = 1
            }
          }

          function Invoke-SmokeTest {
            param(
              [string]$ScriptPath,
              [string[]]$ExpectedStrings
            )
            $name = Split-Path $ScriptPath -Leaf
            Write-Host "=== Smoke testing (PS 5.1): $name ==="
            $env:DAAF_DRY_RUN = "1"
            $env:DAAF_NESTED = "1"
            try {
              $output = & $ScriptPath *>&1 | Out-String
              if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
                Write-Host "FAILED: $name (exit code $LASTEXITCODE)"
                $script:failed = 1
              }
            } catch {
              Write-Host "FAILED: $name - $_"
              $script:failed = 1
              return
            }
            foreach ($pattern in $ExpectedStrings) {
              Assert-OutputContains $name $output $pattern
            }
          }

          Invoke-SmokeTest "scripts/host/install.ps1" @(
            "DAAF Installer",
            "Installation complete!"
          )

          Invoke-SmokeTest "scripts/host/backup_daaf.ps1" @(
            "[DRY-RUN]",
            "DAAF Backup",
            "[DRY-RUN] Would copy"
          )

          Invoke-SmokeTest "scripts/host/rebuild_daaf.ps1" @(
            "DAAF Rebuild",
            "Rebuild complete!"
          )

          Invoke-SmokeTest "scripts/host/update_daaf.ps1" @(
            "DAAF Updater",
            "Already up to date!"
          )

          Invoke-SmokeTest "scripts/host/migrate_daaf.ps1" @(
            "DAAF Migration",
            "Migration complete!"
          )

          Invoke-SmokeTest "scripts/host/restore_from_backup.ps1" @(
            "DAAF Restore from Backup",
            "Restore dry-run complete!"
          )

          Invoke-SmokeTest "scripts/host/view_logs.ps1" @(
            "DAAF container is running.",
            "Opening DAAF Log Explorer"
          )

          Invoke-SmokeTest "scripts/host/view_notebooks.ps1" @(
            "DAAF container is running.",
            "Opening DAAF Notebook Browser"
          )

          Invoke-SmokeTest "scripts/host/view_quarto.ps1" @(
            "DAAF container is running.",
            "Discovering Quarto notebooks under research/"
          )

          Invoke-SmokeTest "scripts/host/run_vscode.ps1" @(
            "DAAF container is running.",
            "Opening DAAF Code Browser"
          )

          Invoke-SmokeTest "scripts/host/run_daaf.ps1" @(
            "DAAF container is already running.",
            "Launching Claude Code"
          )

          # daaf.ps1 Control Panel under Windows PS 5.1: interactive menu loop,
          # driven with `q` on stdin to quit after the first menu draw. Seed a
          # backup dir so Get-DaafStatus's last-backup path executes, and
          # require docker-compose.yml (repo root after checkout) for the
          # preflight. DAAF_DRY_RUN=1 mocks Docker.
          #
          # IMPORTANT: spawn a CHILD PROCESS via -NoProfile -File so that piped
          # input reaches [Console]::In (stdin) inside daaf.ps1. Piping into an
          # in-process `& script.ps1` feeds the PS pipeline, NOT stdin, so
          # Read-DaafLine's [Console]::In.ReadLine() would block waiting for
          # real terminal input and hang the job.
          Write-Host "=== Smoke testing (PS 5.1): scripts/host/daaf.ps1 (Control Panel) ==="
          New-Item -ItemType Directory -Path "./2026-06-18_daaf_backup" -Force | Out-Null
          $env:DAAF_DRY_RUN = "1"
          Remove-Item Env:\DAAF_NESTED -ErrorAction SilentlyContinue
          $panelOut = "q" | & powershell -NoProfile -File scripts/host/daaf.ps1 2>&1 | Out-String
          Remove-Item -Recurse -Force "./2026-06-18_daaf_backup" -ErrorAction SilentlyContinue
          Assert-OutputContains "daaf.ps1" $panelOut "DAAF Control Panel"
          Assert-OutputContains "daaf.ps1" $panelOut "Goodbye!"

          if ($failed) {
            Write-Host ""
            Write-Host "One or more smoke tests failed."
            exit 1
          }
          Write-Host ""
          Write-Host "All PS 5.1 smoke tests passed."

  # ---------------------------------------------------------------------------
  # Job 9: Host-script coverage under real Bash 3.2 (deterministic container)
  # ---------------------------------------------------------------------------
  # The macOS smoke job (Job 8) pins Bash 3.2 via /bin/bash, but macOS runners
  # are comparatively slow and their bash patch level can drift. This job runs
  # the host scripts inside the official `bash:3.2` Docker image on ubuntu:
  # deterministic (exact 3.2.57 semantics), fast, and independent of runner
  # image changes. It targets the same defect class — constructs that parse
  # cleanly (so `bash -n` and ShellCheck pass) but fail at *runtime* under 3.2,
  # e.g. the negative array subscript that historically crashed daaf.sh.
  #
  # Implementation choice — syntax + DRY_RUN smoke, NOT bats:
  # The natural instinct is to run tests/bash/*.bats under bash:3.2. In practice
  # that is awkward: the `bash:3.2` image is Alpine-based with no bats package in
  # apk and no git/make to bootstrap bats-core, so provisioning bats inside 3.2
  # is brittle and slow. The task explicitly sanctions the fallback of running
  # each host script's syntax check plus a DAAF_DRY_RUN smoke under the 3.2
  # image, which is what we do here. This is sufficient for the goal: the
  # runtime-only 3.2 incompatibilities surface when the script actually executes
  # under 3.2 with Docker mocked, which the DRY_RUN smoke drives. Unit-level
  # assertions remain covered by the ubuntu bats-tests job (Job 5).
  bats-bash32:
    name: Host Scripts under Bash 3.2
    runs-on: ubuntu-latest
    container:
      image: bash:3.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The bash:3.2 image is minimal (Alpine). Confirm the interpreter version
      # so the log makes the environment unambiguous.
      - name: Show Bash version
        run: bash --version | head -1

      # bash -n parses every host .sh under 3.2. This catches 3.2 *parse*
      # errors; it deliberately does not catch runtime-only issues (that is the
      # smoke step's job) but is a cheap first gate.
      - name: Syntax-check host scripts (bash -n)
        run: |
          failed=0
          for f in scripts/host/*.sh; do
            echo "=== bash -n: $f ==="
            if ! bash -n "$f"; then
              echo "FAILED: $f has a syntax error under Bash 3.2"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "All host scripts parse under Bash 3.2."

      # DRY_RUN smoke of the run-once lifecycle scripts under 3.2. Docker/curl
      # are mocked by DAAF_DRY_RUN=1, so no daemon is needed inside the
      # container. DAAF_NESTED=1 suppresses pause-on-exit prompts.
      - name: Smoke test lifecycle scripts (Bash 3.2, dry-run)
        run: |
          failed=0
          for f in install backup_daaf rebuild_daaf update_daaf migrate_daaf \
                   restore_from_backup view_logs view_notebooks view_quarto run_vscode run_daaf; do
            echo "=== Bash 3.2 smoke: scripts/host/${f}.sh ==="
            if ! DAAF_DRY_RUN=1 DAAF_NESTED=1 bash "scripts/host/${f}.sh" >/dev/null 2>&1; then
              echo "FAILED: ${f}.sh (exit code $?) under Bash 3.2"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "All lifecycle scripts ran under Bash 3.2."

      # daaf.sh Control Panel under 3.2: seed a backup dir to force the
      # gather_status last-backup path (the historically fatal one), drive the
      # menu loop with `q`, and require docker-compose.yml (present at repo root
      # after checkout) for the preflight.
      - name: Smoke test daaf.sh Control Panel (Bash 3.2)
        run: |
          mkdir -p ./2026-06-18_daaf_backup
          echo "=== Bash 3.2 smoke: scripts/host/daaf.sh (Control Panel) ==="
          out=$(printf 'q\n' | DAAF_DRY_RUN=1 bash scripts/host/daaf.sh 2>&1) || {
            echo "FAILED: daaf.sh (exit code $?) under Bash 3.2"
            echo "$out"
            rm -rf ./2026-06-18_daaf_backup
            exit 1
          }
          rm -rf ./2026-06-18_daaf_backup
          failed=0
          echo "$out" | grep -qF "DAAF Control Panel" || { echo "  FAIL: missing 'DAAF Control Panel'"; failed=1; }
          echo "$out" | grep -qF "Goodbye!" || { echo "  FAIL: missing 'Goodbye!'"; failed=1; }
          if [ "$failed" -ne 0 ]; then
            echo "--- captured output ---"
            echo "$out"
            exit 1
          fi
          echo "daaf.sh Control Panel ran under Bash 3.2."
