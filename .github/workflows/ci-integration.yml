# CI: Docker Integration Tests
#
# End-to-end tests for DAAF's host lifecycle scripts running against a real
# Docker daemon. Verifies install, run, backup, update, rebuild, and migrate
# workflows behave correctly with actual containers and volumes.
#
# Companion workflow: ci-scripts.yml handles lint, unit tests, and cross-platform
# dry-run smoke tests (no Docker required).
#
# Six jobs:
#   1. lifecycle-test       - Full lifecycle: install -> run -> backup -> update -> rebuild
#   2. migrate-era1         - Migration of clone-based installations (origin remote present)
#   3. migrate-era2         - Migration of ZIP-based installations (no remote, requires graft)
#   4. failure-resilience   - Graceful failure handling and edge cases
#   5. smoke-suite          - run R + Python skill smokes inside the built image
#   6. restore-failure-paths - restore failure paths field-tested on Windows
#                             (leftover holders, swap container), plus the backup
#                             and restore startup checks (helper-image download,
#                             Docker version) and busybox pin consistency
#
# Not tested here:
#   - view_logs.sh/ps1: Invokes `docker compose logs --follow`, which is a
#     blocking/streaming command unsuitable for CI. Covered by dry-run smoke
#     tests in ci-scripts.yml.
#   - Windows Docker integration: GitHub-hosted Windows runners have Docker
#     configured for Windows containers, not Linux containers. DAAF uses Linux
#     containers. Windows PowerShell logic is covered by the dry-run smoke
#     tests in ci-scripts.yml.
#
# Triggers: weekly (Sunday 6 AM UTC), manual dispatch, release tags,
#   push/PR when Dockerfile, docker-compose.yml, or host scripts change.
# All jobs run on both ubuntu-latest (amd64) and ubuntu-24.04-arm (arm64)
# with a 30-minute timeout.

name: CI - Integration

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6 AM UTC
  workflow_dispatch: {}
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/host/**'
      - '.github/workflows/ci-integration.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/host/**'
      - '.github/workflows/ci-integration.yml'

permissions:
  contents: read

# DAAF_BRANCH tells install/migrate/rebuild scripts which ref to clone from.
# Resolves to the branch name for schedule/dispatch, or the tag name for
# release-tag pushes (git clone -b accepts both).
#
# update_daaf.sh requires a BRANCH (not a tag) because it merges upstream
# changes. Steps that invoke update_daaf.sh override DAAF_BRANCH to "" so
# the script auto-detects main/master. See "env: DAAF_BRANCH" overrides below.
#
# DAAF_NESTED suppresses the interactive pause-before-exit in all scripts.
env:
  DAAF_BRANCH: ${{ github.ref_name }}
  DAAF_NESTED: "1"

# ---------------------------------------------------------------------------
# Job 1: Full lifecycle — install, run, backup, update, rebuild
# ---------------------------------------------------------------------------
# Exercises the standard user journey: install DAAF from scratch, verify the
# container is operational, run a command inside it, create a backup, attempt
# an update (no-op on fresh install), rebuild the image, and confirm
# everything still works afterward.
jobs:
  lifecycle-test:
    name: Lifecycle Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # --- Install ---
      # install.sh creates daaf-docker/ in the current working directory,
      # downloads docker-compose.yml, Dockerfile, and all host scripts there,
      # builds the Docker image, and clones the repo into the container.
      - name: Install DAAF via install.sh
        run: bash scripts/host/install.sh

      # --- Verify container is running ---
      # install.sh has its own readiness wait, but add a retry loop as a
      # safety net for slow CI runners. docker compose ps shows "Up" in the
      # STATUS column (not "running").
      - name: Verify container is running
        working-directory: daaf-docker
        run: |
          for i in 1 2 3 4 5; do
            docker compose ps | grep -q "Up" && exit 0
            echo "Waiting for container to be ready (attempt $i/5)..."
            sleep 3
          done
          echo "ERROR: Container did not reach running state"
          docker compose ps
          exit 1

      # --- Verify CLAUDE.md exists in the container ---
      - name: Verify CLAUDE.md present in container
        working-directory: daaf-docker
        run: docker compose exec -T daaf-docker test -f /daaf/CLAUDE.md

      # --- Run a quick command inside the container ---
      # Uses the downloaded copy of run_daaf.sh (as a real user would).
      - name: Run test command via run_daaf.sh
        working-directory: daaf-docker
        run: bash run_daaf.sh echo "DAAF is working"

      # --- Seed pathological symlinks into the data volume (round-trip fixtures) ---
      # These exercise the backup STAGE_PROGRAM strip+manifest and the restore
      # SYMLINK_REPLAY across a REAL backup->restore cycle. Names/targets chosen to
      # stress every branch: a space in the name, a unicode name, a broken target,
      # an absolute target, and a relative target. NONE contain a tab or newline
      # (those are the gate-trip cases, tested separately in Group C).
      - name: Seed symlink fixtures for round-trip test
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            set -e
            d=/daaf/research/_ci_symlink_fixtures
            mkdir -p "$d/realdir"
            echo content > "$d/realfile"
            ln -sf realfile           "$d/rel link"          # space in NAME, relative target
            ln -sf realfile           "$d/uniçode-límk"      # unicode name
            ln -sf /nonexistent/target "$d/broken"           # broken (dangling) target
            ln -sf /daaf/CLAUDE.md    "$d/abs_link"          # absolute target
            ln -sf ../realfile        "$d/realdir/updir"     # relative w/ traversal
            # Record the canonical (name -> target) set for post-restore comparison.
            find "$d" -type l | sort > /daaf/research/_ci_link_names.txt
            find "$d" -type l -exec readlink {} \; | sort > /daaf/research/_ci_link_targets.txt
            echo "Seeded symlinks:"; cat /daaf/research/_ci_link_names.txt
          '

      # --- Backup ---
      - name: Create backup via backup_daaf.sh
        working-directory: daaf-docker
        run: bash backup_daaf.sh

      # backup_daaf.sh creates YYYY-MM-DD_daaf_backup/ in the current directory
      - name: Verify backup directory was created
        working-directory: daaf-docker
        run: ls -la *_daaf_backup/

      # --- Restore from backup (round-trip test) ---
      # The restore script detects the running container and offers to stop it.
      # Pipe: "y" (accept stop), "1" (select first backup), "RESTORE" (confirm).
      - name: Restore from backup via restore_from_backup.sh
        working-directory: daaf-docker
        run: printf 'y\n1\nRESTORE\n' | bash restore_from_backup.sh

      - name: Start container after restore
        working-directory: daaf-docker
        run: docker compose up -d

      - name: Wait for container readiness after restore
        working-directory: daaf-docker
        run: |
          for i in 1 2 3 4 5; do
            docker compose ps | grep -q "Up" && exit 0
            echo "Waiting for container to be ready (attempt $i/5)..."
            sleep 3
          done
          echo "ERROR: Container did not reach running state after restore"
          docker compose ps
          exit 1

      - name: Verify CLAUDE.md present after restore
        working-directory: daaf-docker
        run: docker compose exec -T daaf-docker test -f /daaf/CLAUDE.md

      # --- Verify the symlink fixtures round-tripped via the manifest ---
      # After restore, every seeded link must exist again as a symlink with the
      # SAME name and SAME target it had before backup. The backup stripped them
      # into .daaf-symlinks and the restore replayed them; this proves the whole
      # STAGE_PROGRAM -> manifest -> SYMLINK_REPLAY chain end to end.
      - name: Verify symlinks reproduced by backup/restore round-trip
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            set -e
            d=/daaf/research/_ci_symlink_fixtures
            # Every recorded path must still BE a symlink (-L) after restore.
            while IFS= read -r p; do
              [ -L "$p" ] || { echo "MISSING or not-a-symlink after restore: $p"; exit 1; }
            done < /daaf/research/_ci_link_names.txt
            # Names and targets must match the pre-backup snapshot exactly.
            find "$d" -type l | sort > /tmp/after_names.txt
            find "$d" -type l -exec readlink {} \; | sort > /tmp/after_targets.txt
            diff /daaf/research/_ci_link_names.txt   /tmp/after_names.txt
            diff /daaf/research/_ci_link_targets.txt /tmp/after_targets.txt
            # The manifest itself must NOT survive into the restored tree (it is
            # metadata, stripped by replay).
            test ! -e "$d/.daaf-symlinks"
            echo "Symlink round-trip OK: all fixtures reproduced with matching targets."
          '

      # --- Update (no-op on fresh install) ---
      - name: Run update_daaf.sh (no-op on fresh install)
        working-directory: daaf-docker
        env:
          DAAF_BRANCH: ""
        run: bash update_daaf.sh

      - name: Verify container running after update
        working-directory: daaf-docker
        run: docker compose ps | grep -q "Up"

      # --- Simulate user work-in-progress ---
      # Add a committed file and an uncommitted file to verify that rebuild
      # preserves user data. Placed after update (which is a no-op on a fresh
      # install) so the local commit doesn't trigger update's interactive
      # prompt_choice for "ahead" branches.
      - name: Add committed research file
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            mkdir -p /daaf/research
            echo "My analysis notes" > /daaf/research/local_work.txt
            git -C /daaf add research/local_work.txt
            git -C /daaf commit -m "Local research work"
          '

      - name: Add uncommitted file edit
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            echo "Work in progress" > /daaf/research/uncommitted_draft.txt
          '

      # --- Rebuild ---
      - name: Rebuild image via rebuild_daaf.sh
        working-directory: daaf-docker
        run: bash rebuild_daaf.sh

      # --- Post-rebuild verification ---
      - name: Verify container running after rebuild
        working-directory: daaf-docker
        run: docker compose ps | grep -q "Up"

      - name: Verify CLAUDE.md present after rebuild
        working-directory: daaf-docker
        run: docker compose exec -T daaf-docker test -f /daaf/CLAUDE.md

      # --- Verify user work survived rebuild ---
      - name: Verify committed file preserved after rebuild
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "My analysis notes" /daaf/research/local_work.txt
            git -C /daaf log --oneline -1 | grep -q "Local research work"
          '

      - name: Verify uncommitted file preserved after rebuild
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "Work in progress" /daaf/research/uncommitted_draft.txt
          '

      # --- Multiple backups in one day ---
      - name: Create second backup (suffix test)
        working-directory: daaf-docker
        run: bash backup_daaf.sh

      - name: Verify two backup directories exist with date suffix
        working-directory: daaf-docker
        run: |
          count=$(ls -d *_daaf_backup 2>/dev/null | wc -l)
          echo "Found $count backup directories"
          if [ "$count" -lt 2 ]; then
            echo "ERROR: Expected at least 2 backup directories"
            ls -la *_daaf_backup* 2>/dev/null || true
            exit 1
          fi

      # --- Rebuild with no changes ---
      - name: Rebuild again (no-changes test)
        working-directory: daaf-docker
        run: bash rebuild_daaf.sh 2>&1 | tee /tmp/rebuild_nochange.txt

      - name: Verify no-changes message
        run: grep -qi "No changes detected" /tmp/rebuild_nochange.txt

      # --- Update with no upstream changes ---
      - name: Run update (no-op after fresh install)
        working-directory: daaf-docker
        env:
          DAAF_BRANCH: ""
        run: bash update_daaf.sh 2>&1 | tee /tmp/update_noop.txt

      - name: Verify already up to date
        run: grep -qi "Already up to date" /tmp/update_noop.txt

      # --- Negative case: a tab-named symlink must trip the staging gate ---
      # The backup STAGE_PROGRAM gate rejects symlink names/targets containing a
      # TAB or NEWLINE (they break the TAB-separated .daaf-symlinks manifest). The
      # backup MUST fail (nonzero) AND the driver MUST surface the offender in its
      # captured output -- the exact contract the 2026-07-14 field failure broke
      # (PS 5.1 dropped the container stderr, so the offender never reached the
      # user). We assert BOTH: nonzero exit, and the offender text present.
      - name: Seed a tab-named symlink (gate-trip fixture)
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            set -e
            d=/daaf/research/_ci_gate_trip
            mkdir -p "$d"
            echo content > "$d/realfile"
            # Create a symlink whose NAME contains a literal tab.
            ln -sf realfile "$(printf "%s/bad\tname" "$d")"
          '
      - name: Backup must FAIL and name the tab offender
        working-directory: daaf-docker
        run: |
          set +e
          bash backup_daaf.sh > /tmp/gate_trip.log 2>&1
          rc=$?
          set -e
          echo "backup exit code: $rc"; echo "----- captured -----"; cat /tmp/gate_trip.log
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: backup succeeded but a tab-named symlink should have tripped the gate"; exit 1
          fi
          # The offender list must have reached the driver output (STAGE_ERR_TAB
          # marker and/or the offending path). This is the field-failure guard.
          grep -qi 'STAGE_ERR_TAB\|embed a tab' /tmp/gate_trip.log \
            || { echo "ERROR: gate tripped but the offender text never reached the captured output"; exit 1; }
          echo "Gate-trip negative case OK: backup failed and named the offender."
      - name: Remove gate-trip fixture (so cleanup + any later steps are clean)
        if: always()
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker sh -c '
            find /daaf/research/_ci_gate_trip -type l -delete 2>/dev/null || true
            rm -rf /daaf/research/_ci_gate_trip 2>/dev/null || true
          ' || true

      # --- Cleanup ---
      # Use conditional directory check because install.sh may not have created
      # daaf-docker/ if it failed early.
      - name: Docker cleanup
        if: always()
        run: |
          if [ -d daaf-docker ]; then
            cd daaf-docker
            docker compose down -v --rmi local --remove-orphans
          fi

  # ---------------------------------------------------------------------------
  # Job 2: Migration — Era 1 (clone-based installation)
  # ---------------------------------------------------------------------------
  # Simulates how Era 1 users actually installed DAAF: they ran git clone
  # directly, then docker compose up. No install.sh existed yet. The container
  # has /daaf populated via git clone with origin configured.
  # migrate_daaf.sh should detect "clone-based installation" and succeed.
  # The second run tests idempotency.
  migrate-era1:
    name: Migrate (Era 1 - Clone) (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # --- Simulate Era 1 installation (git clone + docker compose up) ---
      # Era 1 users cloned the repo on their host, then ran docker compose up.
      # We replicate this by: (1) building the container from the repo's
      # Dockerfile/docker-compose.yml, then (2) git cloning inside the container
      # (exactly what Era 1 users' startup process did).
      - name: Build and start container
        run: docker compose up -d --build

      - name: Wait for container readiness
        run: |
          for i in 1 2 3 4 5; do
            docker compose ps | grep -q "Up" && exit 0
            sleep 3
          done
          echo "ERROR: Container not ready"; docker compose ps; exit 1

      - name: Populate /daaf via git clone (Era 1 method)
        env:
          DAAF_BRANCH: ${{ github.ref_type == 'tag' && 'main' || github.ref_name }}
        run: |
          docker compose exec -T daaf-docker \
            git clone -b "$DAAF_BRANCH" \
            "https://github.com/DAAF-Contribution-Community/daaf.git" /tmp/daaf-clone
          docker compose exec -T daaf-docker \
            bash -c 'cp -a /tmp/daaf-clone/. /daaf/ && rm -rf /tmp/daaf-clone'

      - name: Verify DAAF files present
        run: docker compose exec -T daaf-docker test -f /daaf/CLAUDE.md

      # --- Pre-migration verification: confirm Era 1 simulation fidelity ---
      # These checks verify the simulated environment matches what real Era 1
      # (clone-based) installations looked like, BEFORE migration runs.
      - name: "Pre-migration: verify origin remote exists (Era 1 marker)"
        run: |
          url=$(docker compose exec -T daaf-docker git -C /daaf remote get-url origin 2>/dev/null)
          echo "Origin URL: $url"
          echo "$url" | grep -qi "DAAF-Contribution-Community/daaf"

      - name: "Pre-migration: verify .claude/agents/ exists (current-branch files)"
        run: docker compose exec -T daaf-docker test -d /daaf/.claude/agents

      - name: "Pre-migration: verify top-level agents/ does not exist (post-v1 layout)"
        run: |
          if docker compose exec -T daaf-docker test -d /daaf/agents 2>/dev/null; then
            echo "ERROR: top-level agents/ should not exist on current branch"
            exit 1
          fi
          echo "Confirmed: no top-level agents/ directory"

      # --- Simulate user work-in-progress ---
      - name: Add committed research file
        run: |
          docker compose exec -T daaf-docker bash -c '
            mkdir -p /daaf/research
            echo "My analysis notes" > /daaf/research/local_work.txt
            git -C /daaf add research/local_work.txt
            git -C /daaf commit -m "Local research work"
          '

      - name: Add uncommitted file edit
        run: |
          docker compose exec -T daaf-docker bash -c '
            echo "Work in progress" > /daaf/research/uncommitted_draft.txt
          '

      # migrate_daaf.sh discovers the container via the daaf_daaf-data volume.
      # It needs docker-compose.yml in the current directory to run backup.
      - name: Run migrate_daaf.sh (should detect Era 1)
        id: migrate_era1
        run: bash scripts/host/migrate_daaf.sh 2>&1 | tee /tmp/migrate_era1_output.txt

      # --- Post-migration verification: confirm Era 1 path was taken ---
      - name: "Post-migration: verify 'clone-based' detected in output"
        run: grep -qi "clone-based" /tmp/migrate_era1_output.txt

      - name: "Post-migration: verify branch tracks origin"
        run: |
          tracking=$(docker compose exec -T daaf-docker \
            git -C /daaf rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null || true)
          echo "Tracking: $tracking"
          echo "$tracking" | grep -q "origin/"

      # Verify origin remote is configured and points to the repo
      - name: Verify origin remote is configured
        run: docker compose exec -T daaf-docker git -C /daaf remote -v

      # Verify fetch works (future updates will succeed)
      - name: Verify git fetch origin succeeds
        run: docker compose exec -T daaf-docker git -C /daaf fetch origin

      # Run again to confirm idempotency — should succeed without errors
      - name: Run migrate_daaf.sh again (idempotency check)
        run: bash scripts/host/migrate_daaf.sh 2>&1 | tee /tmp/migrate_era1_idem.txt

      - name: "Idempotency: verify Migration complete on re-run"
        run: grep -qi "Migration complete" /tmp/migrate_era1_idem.txt

      # --- Verify user work survived migration ---
      - name: Verify committed file preserved after migration
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "My analysis notes" /daaf/research/local_work.txt
            git -C /daaf log --oneline | grep -q "Local research work"
          '

      - name: Verify uncommitted file preserved after migration
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "Work in progress" /daaf/research/uncommitted_draft.txt
          '

      # --- Cleanup ---
      - name: Docker cleanup
        if: always()
        run: docker compose down -v --rmi local --remove-orphans

  # ---------------------------------------------------------------------------
  # Job 3: Migration — Era 2 (ZIP-based installation, no remote)
  # ---------------------------------------------------------------------------
  # Simulates how Era 2 users actually installed DAAF: they downloaded a ZIP
  # from GitHub, extracted it, and ran docker compose up. No git remote exists.
  # The container has DAAF files with local git history but no origin.
  # migrate_daaf.sh should detect "ZIP-based installation", add origin, fetch
  # upstream history, and graft local history onto it.
  migrate-era2:
    name: Migrate (Era 2 - ZIP) (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # --- Simulate Era 2 installation (ZIP extraction + docker compose up) ---
      # Era 2 users downloaded a ZIP from a specific release tag, extracted it,
      # and ran docker compose up. We replicate this by: (1) building the
      # container, then (2) cloning a known tag inside the container (to get
      # files matching a real historical commit), then (3) stripping .git and
      # re-initializing as a local-only repo (matching what ZIP users had).
      # Using v2.0.0 files ensures the migration's blob-tree search finds an
      # exact match against the upstream v2.0.0 tag.
      - name: Build and start container
        run: docker compose up -d --build

      - name: Wait for container readiness
        run: |
          for i in 1 2 3 4 5; do
            docker compose ps | grep -q "Up" && exit 0
            sleep 3
          done
          echo "ERROR: Container not ready"; docker compose ps; exit 1

      - name: Populate /daaf with v2.0.0 files (ZIP simulation)
        run: |
          docker compose exec -T daaf-docker bash -c '
            git clone --depth 1 -b v2.0.0 \
              https://github.com/DAAF-Contribution-Community/daaf.git /tmp/daaf-zip
            rm -rf /tmp/daaf-zip/.git
            cp -a /tmp/daaf-zip/. /daaf/
            rm -rf /tmp/daaf-zip
          '

      - name: Initialize local git repo (as ZIP users would have)
        run: |
          docker compose exec -T daaf-docker bash -c '
            cd /daaf
            git init
            git branch -m main
            git add -A
            git commit -m "Initial DAAF installation"
          '

      - name: Verify no remote exists
        run: |
          output=$(docker compose exec -T daaf-docker git -C /daaf remote -v 2>&1 || true)
          if echo "$output" | grep -q "origin"; then
            echo "ERROR: origin remote should not exist in ZIP simulation"
            exit 1
          fi
          echo "Confirmed: no origin remote (ZIP simulation correct)"

      - name: Verify DAAF files present
        run: docker compose exec -T daaf-docker test -f /daaf/CLAUDE.md

      # --- Pre-migration verification: confirm Era 2 simulation fidelity ---
      # These checks verify the simulated environment matches what real Era 2
      # (ZIP-based v2.0.0) installations looked like, BEFORE migration runs.
      # v2.0.0 had scripts/entrypoint.sh (removed in current era) and
      # .claude/agents/ (moved from top-level agents/ in v1.0.0).
      - name: "Pre-migration: verify scripts/entrypoint.sh exists (v2.0.0 marker)"
        run: docker compose exec -T daaf-docker test -f /daaf/scripts/entrypoint.sh

      - name: "Pre-migration: verify .claude/agents/ exists (v2.0.0 layout)"
        run: docker compose exec -T daaf-docker test -d /daaf/.claude/agents

      - name: "Pre-migration: verify top-level agents/ does not exist (v1-only)"
        run: |
          if docker compose exec -T daaf-docker test -d /daaf/agents 2>/dev/null; then
            echo "ERROR: top-level agents/ should not exist in v2.0.0 layout"
            exit 1
          fi
          echo "Confirmed: no top-level agents/ directory (correct for v2.0.0)"

      - name: "Pre-migration: verify no tests/ directory (post-v2 only)"
        run: |
          if docker compose exec -T daaf-docker test -d /daaf/tests 2>/dev/null; then
            echo "ERROR: tests/ should not exist in v2.0.0 layout"
            exit 1
          fi
          echo "Confirmed: no tests/ directory (correct for v2.0.0)"

      - name: "Pre-migration: verify no scripts/host/ directory (post-v2 only)"
        run: |
          if docker compose exec -T daaf-docker test -d /daaf/scripts/host 2>/dev/null; then
            echo "ERROR: scripts/host/ should not exist in v2.0.0 layout"
            exit 1
          fi
          echo "Confirmed: no scripts/host/ directory (correct for v2.0.0)"

      - name: "Pre-migration: verify CITATION.cff exists (added in v2.0.0)"
        run: docker compose exec -T daaf-docker test -f /daaf/CITATION.cff

      # --- Simulate user work-in-progress ---
      - name: Add committed research file
        run: |
          docker compose exec -T daaf-docker bash -c '
            mkdir -p /daaf/research
            echo "My analysis notes" > /daaf/research/local_work.txt
            git -C /daaf add research/local_work.txt
            git -C /daaf commit -m "Local research work"
          '

      - name: Add uncommitted file edit
        run: |
          docker compose exec -T daaf-docker bash -c '
            echo "Work in progress" > /daaf/research/uncommitted_draft.txt
          '

      # Run migrate — should detect Era 2, add origin, fetch, and graft
      - name: Run migrate_daaf.sh (should detect Era 2)
        id: migrate_era2
        run: bash scripts/host/migrate_daaf.sh 2>&1 | tee /tmp/migrate_era2_output.txt

      # --- Post-migration verification: confirm Era 2 path was taken ---
      - name: "Post-migration: verify 'ZIP-based' detected in output"
        run: grep -qi "ZIP-based" /tmp/migrate_era2_output.txt

      - name: "Post-migration: verify graft was applied (initial commit has parent)"
        run: |
          docker compose exec -T daaf-docker bash -c '
            initial=$(git -C /daaf rev-list --max-parents=0 HEAD | tail -1)
            parent_count=$(git -C /daaf cat-file -p "$initial" | grep -c "^parent " || echo "0")
            echo "Initial commit: $initial"
            echo "Parent count: $parent_count"
            if [ "$parent_count" -eq 0 ]; then
              echo "ERROR: graft was not applied — initial commit has no parent"
              exit 1
            fi
            echo "Confirmed: graft applied (initial commit has $parent_count parent(s))"
          '

      - name: "Post-migration: verify branch tracks origin"
        run: |
          tracking=$(docker compose exec -T daaf-docker \
            git -C /daaf rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null || true)
          echo "Tracking: $tracking"
          echo "$tracking" | grep -q "origin/"

      # Verify origin was added
      - name: Verify origin remote was added
        run: docker compose exec -T daaf-docker git -C /daaf remote -v | grep origin

      # Verify fetch works (graft connected the histories)
      - name: Verify git fetch origin succeeds
        run: docker compose exec -T daaf-docker git -C /daaf fetch origin

      # Run again to confirm idempotency — graft already in place
      - name: Run migrate_daaf.sh again (idempotency check)
        run: bash scripts/host/migrate_daaf.sh 2>&1 | tee /tmp/migrate_era2_idem.txt

      # After migration, origin remote exists so the re-run detects Era 1
      # (clone-based) rather than re-entering the Era 2 graft path. The
      # correct idempotency check is that migration completes successfully.
      - name: "Idempotency: verify Migration complete on re-run"
        run: grep -qi "Migration complete" /tmp/migrate_era2_idem.txt

      # --- Verify file permissions after migration ---
      - name: Verify .sh files are executable after migration
        run: |
          docker compose exec -T daaf-docker bash -c '
            non_exec=$(find /daaf -name "*.sh" -not -perm /111 2>/dev/null | head -5)
            if [ -n "$non_exec" ]; then
              echo "WARNING: Non-executable .sh files found after migration:"
              echo "$non_exec"
            fi
            echo "Permission check complete"
          '

      # --- Verify user work survived migration ---
      - name: Verify committed file preserved after migration
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "My analysis notes" /daaf/research/local_work.txt
            git -C /daaf log --oneline | grep -q "Local research work"
          '

      - name: Verify uncommitted file preserved after migration
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "Work in progress" /daaf/research/uncommitted_draft.txt
          '

      # --- Cleanup ---
      - name: Docker cleanup
        if: always()
        run: docker compose down -v --rmi local --remove-orphans

  # ---------------------------------------------------------------------------
  # Job 4: Failure Resilience
  # ---------------------------------------------------------------------------
  # Tests that lifecycle scripts handle error conditions gracefully: duplicate
  # installs, missing backups, build failures, local-only commits, and
  # concurrent execution guards.
  failure-resilience:
    name: Failure Resilience (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # --- Install DAAF (baseline for all failure tests) ---
      - name: Install DAAF via install.sh
        run: bash scripts/host/install.sh

      - name: Verify container is running
        working-directory: daaf-docker
        run: |
          for i in 1 2 3 4 5; do
            docker compose ps | grep -q "Up" && exit 0
            echo "Waiting for container to be ready (attempt $i/5)..."
            sleep 3
          done
          echo "ERROR: Container did not reach running state"
          docker compose ps
          exit 1

      # --- (a) Install detects existing installation ---
      - name: Re-install without force flag (expect failure)
        run: |
          set +e
          bash scripts/host/install.sh > /tmp/reinstall_noforce.txt 2>&1
          EXIT_CODE=$?
          set -e
          cat /tmp/reinstall_noforce.txt
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "ERROR: install.sh should have failed for existing installation"
            exit 1
          fi
          echo "install.sh correctly rejected re-install (exit code $EXIT_CODE)"

      - name: Verify existing installation message
        run: grep -qi "existing.*installation" /tmp/reinstall_noforce.txt

      # --- (b) Install with force reinstall ---
      - name: Re-install with DAAF_FORCE_REINSTALL=1
        run: DAAF_FORCE_REINSTALL=1 bash scripts/host/install.sh

      - name: Verify container running after force reinstall
        working-directory: daaf-docker
        run: docker compose ps | grep -q "Up"

      # --- (c) Backup when volume is empty (fresh) ---
      - name: Backup right after fresh install
        working-directory: daaf-docker
        run: bash backup_daaf.sh

      - name: Verify fresh backup was created
        working-directory: daaf-docker
        run: ls -d *_daaf_backup/ | head -1

      # --- (d) Restore with no backups available ---
      # Create a temporary directory with no backup folders to test the error path.
      # restore_from_backup.sh searches for backup directories in the current
      # directory and exits with code 1 if none are found (before prompting).
      - name: Stop container before no-backup restore test
        working-directory: daaf-docker
        run: docker compose down

      - name: Restore with no backups (expect failure)
        working-directory: daaf-docker
        run: |
          mkdir -p /tmp/empty_restore_dir
          cp restore_from_backup.sh /tmp/empty_restore_dir/
          cp docker-compose.yml /tmp/empty_restore_dir/
          set +e
          cd /tmp/empty_restore_dir && bash restore_from_backup.sh </dev/null > /tmp/restore_nobackup.txt 2>&1
          EXIT_CODE=$?
          cat /tmp/restore_nobackup.txt
          set -e
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "ERROR: restore should have failed with no backups"
            exit 1
          fi
          echo "restore correctly failed (exit code $EXIT_CODE)"

      - name: Verify no-backup error message
        run: grep -qi "No backup folders found" /tmp/restore_nobackup.txt

      # --- (e) Rebuild preserves user data after build failure recovery ---
      - name: Restart container after no-backup restore test
        working-directory: daaf-docker
        run: docker compose up -d

      - name: Add test file to container
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            echo "precious user data" > /daaf/research/resilience_test.txt
            git -C /daaf add research/resilience_test.txt
            git -C /daaf commit -m "Resilience test data"
          '

      - name: Break the Dockerfile intentionally
        working-directory: daaf-docker
        run: |
          cp Dockerfile Dockerfile.good
          docker compose exec -T daaf-docker bash -c 'echo "INVALID_INSTRUCTION this_will_fail" >> /daaf/Dockerfile'

      - name: Rebuild with broken Dockerfile (expect failure)
        working-directory: daaf-docker
        run: |
          set +e
          bash rebuild_daaf.sh > /tmp/rebuild_broken.txt 2>&1
          EXIT_CODE=$?
          set -e
          cat /tmp/rebuild_broken.txt
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "ERROR: rebuild should have failed with broken Dockerfile"
            exit 1
          fi
          echo "rebuild correctly failed (exit code $EXIT_CODE)"

      - name: Fix the Dockerfile
        working-directory: daaf-docker
        run: |
          mv Dockerfile.good Dockerfile
          docker compose exec -T daaf-docker bash -c 'cat > /daaf/Dockerfile' < Dockerfile

      - name: Rebuild with fixed Dockerfile
        working-directory: daaf-docker
        run: bash rebuild_daaf.sh

      - name: Verify user data survived failed rebuild
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "precious user data" /daaf/research/resilience_test.txt
            git -C /daaf log --oneline | grep -q "Resilience test data"
          '

      # --- (f) Update when container has local-only commits ---
      # The container already has the "Resilience test data" commit from (e).
      # update_daaf.sh in non-interactive mode auto-selects the first option
      # (merge) when it detects local commits ahead of upstream.
      - name: Update with local-only commits
        working-directory: daaf-docker
        env:
          DAAF_BRANCH: ""
        run: |
          bash update_daaf.sh > /tmp/update_local_commits.txt 2>&1
          cat /tmp/update_local_commits.txt

      - name: Verify container running after update with local commits
        working-directory: daaf-docker
        run: docker compose ps | grep -q "Up"

      - name: Verify user data preserved after update
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "precious user data" /daaf/research/resilience_test.txt
          '

      # --- (g) Concurrent lock guard ---
      # Start a long-running update in the background, then immediately try
      # a second one. The second should fail with the lock error.
      - name: Test concurrent update lock
        working-directory: daaf-docker
        env:
          DAAF_BRANCH: ""
        run: |
          bash update_daaf.sh &
          BG_PID=$!
          # Poll for lock directory instead of fixed sleep to avoid race window
          for i in $(seq 1 20); do [ -d /tmp/daaf-update.lock.d ] && break; sleep 0.2; done
          set +e
          bash update_daaf.sh > /tmp/update_concurrent.txt 2>&1
          SECOND_EXIT=$?
          cat /tmp/update_concurrent.txt
          set -e
          wait $BG_PID || true
          if [ "$SECOND_EXIT" -eq 0 ]; then
            echo "ERROR: second update should have been blocked by lock"
            exit 1
          fi
          echo "Concurrent update correctly blocked (exit code $SECOND_EXIT)"

      - name: Verify lock error message
        run: grep -qi "already running" /tmp/update_concurrent.txt

      - name: Clean up stale lock if present
        run: rmdir /tmp/daaf-update.lock.d 2>/dev/null || true

      # --- Cleanup ---
      - name: Docker cleanup
        if: always()
        run: |
          if [ -d daaf-docker ]; then
            cd daaf-docker
            docker compose down -v --rmi local --remove-orphans
          fi

  # ---------------------------------------------------------------------------
  # Job 5: Smoke Suite — run R + Python skill smokes inside the built image
  # ---------------------------------------------------------------------------
  smoke-suite:
    name: Smoke Suite (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    timeout-minutes: 30   # build dominates; smoke run is ~2-4 min. Bump to 45
                          # only if the Noble build is measured slower. See note 3.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # --- Build + start the container (single build; reused by exec below) ---
      # install.sh builds the image and clones the repo into the /daaf volume,
      # exactly as a user's first install does. This is the ONLY build in the job.
      - name: Install DAAF via install.sh
        run: bash scripts/host/install.sh

      - name: Verify container is running
        working-directory: daaf-docker
        run: |
          for i in 1 2 3 4 5; do
            docker compose ps | grep -q "Up" && exit 0
            echo "Waiting for container to be ready (attempt $i/5)..."
            sleep 3
          done
          echo "ERROR: Container did not reach running state"
          docker compose ps
          exit 1

      - name: Verify CLAUDE.md present in container (repo populated)
        working-directory: daaf-docker
        run: docker compose exec -T daaf-docker test -f /daaf/CLAUDE.md

      # --- Prepare log-stripped copies so R smokes run LIVE (see note 2) ---
      # Strip each smoke_*.R's appended EXECUTION LOG block into a throwaway
      # copy under scripts/scratch/smoke_live/ (inside the project, audit
      # boundary -- never /tmp). The runner globs smoke_*.R in its own dir, so
      # we copy the runner alongside the stripped scripts and run it there.
      - name: Stage log-stripped smoke copies
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            set -eu
            SRC=/daaf/scripts/smoke_tests
            DST=/daaf/scripts/scratch/smoke_live
            rm -rf "$DST"
            mkdir -p "$DST"
            # Copy runner + all smoke scripts, then strip logs from the copies.
            cp "$SRC"/smoke_*.R "$SRC"/smoke_*.py "$DST/"
            for f in "$DST"/smoke_*.R "$DST"/smoke_*.py; do
              # Delete from the first EXECUTION LOG banner to EOF if present.
              if grep -q "^# EXECUTION LOG" "$f"; then
                line=$(grep -n "^# EXECUTION LOG" "$f" | head -1 | cut -d: -f1)
                # Cut the banner line above it too (the ==== rule) for cleanliness.
                start=$((line - 1))
                head -n $((start - 1)) "$f" > "$f.stripped"
                mv "$f.stripped" "$f"
              fi
            done
            echo "Staged $(ls "$DST"/smoke_*.R "$DST"/smoke_*.py | wc -l) log-stripped smokes"
          '

      # --- Run the full suite live inside the container ---
      # The runner tallies PASS/FAIL/SKIP and exits nonzero if any smoke FAILS.
      # With logs stripped, R smokes run live rather than SKIP.
      - name: Run smoke suite (live) inside container
        working-directory: daaf-docker
        run: |
          docker compose exec -T -e SMOKE_DIR=/daaf/scripts/scratch/smoke_live daaf-docker \
            bash /daaf/scripts/smoke_tests/run_all_smoke_tests.sh

      # --- Cleanup ---
      - name: Docker cleanup
        if: always()
        run: |
          if [ -d daaf-docker ]; then
            cd daaf-docker
            docker compose down -v --rmi local --remove-orphans
          fi

  # ---------------------------------------------------------------------------
  # Job 6: Restore failure paths on real Docker
  # ---------------------------------------------------------------------------
  # The restore FAILURE paths that were field-tested by hand on Windows
  # (research/2026-10-01_FrameworkDev_RestoreCopyThenSwap/
  # 2026-10-06_restore_windows_recheck.md, Checks B-D), plus the backup and
  # restore startup checks (helper-image download, Docker version), run against
  # the runner's REAL Docker so
  # that a new Docker release that changes container states, `docker volume rm`
  # refusals or image references breaks CI instead of a user's restore.
  #
  # Its own install, like the other jobs. The lifecycle job is left alone: its
  # later steps (update, rebuild, backup suffixes) keep their exact behaviour,
  # and here exactly ONE backup folder exists when the restores answer "1"
  # (a failed backup leaves an empty dated folder, so the lifecycle job's later
  # folder list is not a stable choice).
  #
  # restore_from_backup.sh asks, in this order, and each prompt only when its
  # condition holds: "Stop the container now? (y/n)" (only while DAAF is
  # running), the backup number, "Remove it and continue? (y/n)" (only when a
  # leftover temporary copy exists), then "Type RESTORE". DAAF is stopped before
  # the restore steps below, so the first prompt never appears. Answers come from
  # a file so the exit code is the script's own (not a pipeline's).
  #
  # Every step prints the captured output, asserts the exit code and key lines
  # (grep -F), and removes what it created; the final cleanup runs always().
  # Never `docker system prune` / `docker volume prune`.
  restore-failure-paths:
    name: Restore Failure Paths (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install DAAF via install.sh
        run: bash scripts/host/install.sh

      # Same loop as the other jobs, but the status is captured first: this job's
      # shell runs with pipefail, under which `docker compose ps | grep -q` can
      # report a SIGPIPE'd pipeline as failed even when "Up" matched.
      - name: Verify container is running
        working-directory: daaf-docker
        run: |
          for i in 1 2 3 4 5; do
            status=$(docker compose ps)
            if grep -q "Up" <<< "$status"; then exit 0; fi
            echo "Waiting for container to be ready (attempt $i/5)..."
            sleep 3
          done
          echo "ERROR: Container did not reach running state"
          docker compose ps
          exit 1

      # The only backup folder in this job until the image-check backup below, so
      # backup number 1 is always this one.
      - name: Create the baseline backup
        working-directory: daaf-docker
        timeout-minutes: 10
        run: |
          set -u
          bash backup_daaf.sh
          count=$(find . -maxdepth 1 -type d -name '*_daaf_backup' | wc -l)
          ls -d ./*_daaf_backup
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 backup folder, found $count"
            exit 1
          fi

      # The installed restore script resolves its own names (environment_settings.txt,
      # DAAF_PROJECT_NAME, DAAF_DATA_VOLUME_NAME). DAAF_TEST_MODE=1 makes it return
      # before its first docker call, so the names are read from it, not re-derived.
      - name: Resolve the restore's volume names and the pinned helper image
        working-directory: daaf-docker
        run: |
          set -u
          mapfile -t names < <(DAAF_TEST_MODE=1 bash -c '. ./restore_from_backup.sh && printf "%s\n" "${VOLUME_NAME}" "${TEMP_VOLUME_NAME}" "${SWAP_CONTAINER_NAME}" "${CLAUDE_TEMP_VOLUME_NAME}" "${CLAUDE_SWAP_CONTAINER_NAME}" "${BUSYBOX_IMAGE}"')
          printf '  %s\n' "${names[@]}"
          if [ "${#names[@]}" -ne 6 ]; then
            echo "::error::Could not read the names from restore_from_backup.sh (got ${#names[@]} of 6)"
            exit 1
          fi
          # The data volume must be the one DAAF really mounts at /daaf.
          cid=$(docker compose ps -q daaf-docker)
          mounted=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/daaf"}}{{.Name}}{{end}}{{end}}' "$cid")
          echo "Volume mounted at /daaf: $mounted"
          if [ "$mounted" != "${names[0]}" ]; then
            echo "::error::The restore targets '${names[0]}' but DAAF mounts '$mounted' at /daaf"
            exit 1
          fi
          {
            echo "DATA_VOL=${names[0]}"
            echo "TEMP_VOL=${names[1]}"
            echo "SWAP_CT=${names[2]}"
            echo "CLAUDE_TEMP_VOL=${names[3]}"
            echo "CLAUDE_SWAP_CT=${names[4]}"
            echo "BUSYBOX_IMAGE=${names[5]}"
          } >> "$GITHUB_ENV"

      # One digest everywhere: the compose daaf-init `image:` line and every
      # BUSYBOX_IMAGE / $BusyboxImage constant, in the INSTALLED copies (what
      # install.sh downloaded into daaf-docker/) and in the checkout. Also no other
      # digest-pinned busybox reference in any of those files.
      - name: Pin consistency (one busybox digest in compose and every constant)
        run: |
          set -u
          pin="$BUSYBOX_IMAGE"
          echo "Pin (installed restore_from_backup.sh): $pin"
          if ! grep -Eq '^busybox:[0-9][0-9.]*@sha256:[0-9a-f]{64}$' <<< "$pin"; then
            echo "::error::BUSYBOX_IMAGE is not a name:tag@sha256:<64 hex> pin: '$pin'"
            exit 1
          fi
          bad=0
          for f in daaf-docker/docker-compose.yml daaf-docker/backup_daaf.sh daaf-docker/restore_from_backup.sh \
                   docker-compose.yml scripts/host/backup_daaf.sh scripts/host/restore_from_backup.sh \
                   scripts/host/migrate_daaf.sh scripts/host/backup_daaf.ps1 \
                   scripts/host/restore_from_backup.ps1 scripts/host/migrate_daaf.ps1; do
            case "$f" in
              *.sh)  vals=$(sed -n "s/^BUSYBOX_IMAGE='\([^']*\)'\$/\1/p" "$f") ;;
              *.ps1) vals=$(sed -n "s/^\$BusyboxImage = '\([^']*\)'\$/\1/p" "$f") ;;
              *)     vals=$(sed -n 's/^[[:space:]]*image:[[:space:]]*\(busybox[^[:space:]]*\).*$/\1/p' "$f") ;;
            esac
            n=$(printf '%s\n' "$vals" | grep -c . || true)
            others=$(grep -oE "busybox:[^[:space:]'\"]*@sha256:[0-9a-f]{64}" "$f" | sort -u | grep -vxF "$pin" || true)
            if [ "$n" -ne 1 ] || [ "$vals" != "$pin" ]; then
              echo "::error file=$f::Expected exactly one pinned busybox line equal to the pin; found $n: $vals"
              bad=1
            elif [ -n "$others" ]; then
              echo "::error file=$f::Another busybox digest in this file: $others"
              bad=1
            else
              echo "OK  $f"
            fi
          done
          exit "$bad"

      - name: Stop DAAF and check that no leftover exists yet
        working-directory: daaf-docker
        run: |
          set -u
          docker compose down
          running=$(docker ps --filter "volume=$DATA_VOL" --format '{{.Names}}')
          if [ -n "$running" ]; then
            echo "::error::Still running on $DATA_VOL: $running"
            exit 1
          fi
          for v in "$TEMP_VOL" "$CLAUDE_TEMP_VOL"; do
            if docker volume inspect "$v" > /dev/null 2>&1; then
              echo "::error::Volume $v exists before the tests"
              exit 1
            fi
          done
          for c in "$SWAP_CT" "$CLAUDE_SWAP_CT"; do
            if docker container inspect "$c" > /dev/null 2>&1; then
              echo "::error::Container $c exists before the tests"
              exit 1
            fi
          done
          echo "DAAF stopped; no leftover temporary copy or swap container."

      # Version check visibility. A real run, not DAAF_DRY_RUN (whose docker mock
      # prints a fixed 29.1.3). Empty stdin: the run must pass every startup check
      # (version, volume, helper image) and reach the backup list, then stop at the
      # empty backup-number answer (exit 1, "Invalid selection"). A NOTE for a
      # Docker major other than the tested 29 is allowed: logged, never a failure.
      - name: "Version check: the runner's Docker is accepted (NOTE allowed)"
        working-directory: daaf-docker
        timeout-minutes: 5
        run: |
          set -u
          docker version
          line=$(docker version --format '{{.Client.Version}} {{.Server.Version}}')
          echo "::notice title=Runner Docker version::client and engine: $line"
          log="$RUNNER_TEMP/restore_version.log"
          set +e
          bash restore_from_backup.sh < /dev/null > "$log" 2>&1
          rc=$?
          set -e
          echo "restore exit code: $rc"; echo "----- captured -----"; cat "$log"; echo "--------------------"
          if grep -F -e 'too old for the restore' -e 'Could not read the Docker version' "$log"; then
            echo "::error::The restore refused this runner's Docker ($line)"
            exit 1
          fi
          if ! grep -qF 'Available backups (newest first):' "$log"; then
            echo "::error::The restore did not reach the backup list"
            exit 1
          fi
          if [ "$rc" -ne 1 ] || ! grep -qF "ERROR: Invalid selection ''." "$log"; then
            echo "::error::Expected exit 1 at the empty backup-number answer (got $rc)"
            exit 1
          fi
          cmaj=${line%% *}; cmaj=${cmaj%%.*}
          smaj=${line##* }; smaj=${smaj%%.*}
          if grep -qF 'NOTE: The restore has not been tested with this Docker version' "$log"; then
            echo "::notice title=Untested Docker major::$(grep -F 'NOTE: The restore has not been tested' "$log")"
            if [ "$cmaj" = 29 ] && [ "$smaj" = 29 ]; then
              echo "::warning::The NOTE was printed although client and engine are both 29 ($line)"
            fi
          elif [ "$cmaj" != 29 ] || [ "$smaj" != 29 ]; then
            echo "::warning::No NOTE although the Docker major is not 29 ($line)"
          fi

      # D1 (Windows re-check, Check B): a never-started ("Created") container that
      # still references the leftover temp volume. Docker refuses `docker volume rm`
      # while it exists; the restore must remove it (plain docker rm) and complete.
      # Answers: 1 (backup), y (leftover prompt), RESTORE.
      - name: "D1: a never-started holder of a leftover temp copy is removed and the restore completes"
        working-directory: daaf-docker
        timeout-minutes: 10
        run: |
          set -u
          log="$RUNNER_TEMP/restore_d1.log"
          docker volume create "$TEMP_VOL"
          holder=$(docker create -v "$TEMP_VOL:/src" "$BUSYBOX_IMAGE")
          echo "Holder: $holder"
          docker ps -a --filter "volume=$TEMP_VOL" --format '{{.ID}} | {{.Status}}'
          state=$(docker inspect --format '{{.State.Status}}' "$holder")
          if [ "$state" != created ]; then
            echo "::error::Holder state is '$state', expected 'created'"
            exit 1
          fi
          # The setup must reproduce D1: Docker refuses to remove the held volume.
          if docker volume rm "$TEMP_VOL"; then
            echo "::error::docker volume rm succeeded, so this setup does not reproduce D1"
            exit 1
          fi
          printf '1\ny\nRESTORE\n' > "$RUNNER_TEMP/answers_d1"
          set +e
          bash restore_from_backup.sh < "$RUNNER_TEMP/answers_d1" > "$log" 2>&1
          rc=$?
          set -e
          echo "restore exit code: $rc"; echo "----- captured -----"; cat "$log"; echo "--------------------"
          fails=0
          if [ "$rc" -ne 0 ]; then echo "::error::Expected exit 0, got $rc"; fails=1; fi
          for want in "  - Docker volume '$TEMP_VOL'" 'Removed the leftover temporary copy.' 'Restore complete!'; do
            if ! grep -qF -e "$want" "$log"; then echo "::error::Missing from the output: $want"; fails=1; fi
          done
          if grep -nE '^(ERROR|WARNING):' "$log"; then echo "::error::ERROR or WARNING line in the output"; fails=1; fi
          if docker container inspect "$holder" > /dev/null 2>&1; then echo "::error::The holder $holder still exists"; fails=1; fi
          for v in "$TEMP_VOL" "$CLAUDE_TEMP_VOL"; do
            if docker volume inspect "$v" > /dev/null 2>&1; then echo "::error::Temp volume $v still exists"; fails=1; fi
          done
          if ! docker run --rm -v "$DATA_VOL:/v:ro" "$BUSYBOX_IMAGE" test -f /v/CLAUDE.md; then
            echo "::error::CLAUDE.md missing from $DATA_VOL after the restore"; fails=1
          fi
          exit "$fails"

      # Windows re-check, Check C: a RUNNING holder. The restore must refuse after the
      # leftover prompt (exit 1) and remove nothing. Answers: 1, y.
      - name: "Running holder: the restore refuses and removes nothing"
        working-directory: daaf-docker
        timeout-minutes: 10
        run: |
          set -u
          log="$RUNNER_TEMP/restore_running_holder.log"
          docker volume create "$TEMP_VOL"
          docker run -d --name ci_restore_holder -v "$TEMP_VOL:/src" "$BUSYBOX_IMAGE" sleep 300
          docker ps -a --filter "volume=$TEMP_VOL" --format '{{.ID}} | {{.Status}} | {{.Names}}'
          if [ "$(docker inspect --format '{{.State.Running}}' ci_restore_holder)" != true ]; then
            echo "::error::ci_restore_holder is not running"
            exit 1
          fi
          printf '1\ny\n' > "$RUNNER_TEMP/answers_running_holder"
          set +e
          bash restore_from_backup.sh < "$RUNNER_TEMP/answers_running_holder" > "$log" 2>&1
          rc=$?
          set -e
          echo "restore exit code: $rc"; echo "----- captured -----"; cat "$log"; echo "--------------------"
          fails=0
          if [ "$rc" -ne 1 ]; then echo "::error::Expected exit 1, got $rc"; fails=1; fi
          for want in 'ERROR: Something is still using the temporary copy left by the earlier restore' \
                      "(Docker volume '$TEMP_VOL'), so it was not removed."; do
            if ! grep -qF -e "$want" "$log"; then echo "::error::Missing from the output: $want"; fails=1; fi
          done
          for unwanted in 'Removed the leftover temporary copy.' 'Preparing a temporary copy of the backup inside Docker...'; do
            if grep -qF -e "$unwanted" "$log"; then echo "::error::Unexpected in the output: $unwanted"; fails=1; fi
          done
          if ! docker volume inspect "$TEMP_VOL" > /dev/null 2>&1; then echo "::error::Temp volume $TEMP_VOL was removed"; fails=1; fi
          if [ "$(docker inspect --format '{{.State.Running}}' ci_restore_holder 2>/dev/null)" != true ]; then
            echo "::error::ci_restore_holder is no longer running"; fails=1
          fi
          # Leave the runner clean for the next step.
          docker rm -f ci_restore_holder
          docker volume rm "$TEMP_VOL"
          exit "$fails"

      # Windows re-check, Check D (R5): a STOPPED leftover swap container. The restore
      # removes it (plain docker rm), prepares, and is cancelled at RESTORE (exit 0).
      # Answers: 1, y, no.
      - name: "R5: a stopped leftover swap container is removed; cancel at RESTORE"
        working-directory: daaf-docker
        timeout-minutes: 10
        run: |
          set -u
          log="$RUNNER_TEMP/restore_swap_container.log"
          docker create --name "$SWAP_CT" "$BUSYBOX_IMAGE"
          state=$(docker inspect --format '{{.State.Status}}' "$SWAP_CT")
          if [ "$state" != created ]; then
            echo "::error::$SWAP_CT state is '$state', expected 'created'"
            exit 1
          fi
          printf '1\ny\nno\n' > "$RUNNER_TEMP/answers_swap_container"
          set +e
          bash restore_from_backup.sh < "$RUNNER_TEMP/answers_swap_container" > "$log" 2>&1
          rc=$?
          set -e
          echo "restore exit code: $rc"; echo "----- captured -----"; cat "$log"; echo "--------------------"
          fails=0
          if [ "$rc" -ne 0 ]; then echo "::error::Expected exit 0, got $rc"; fails=1; fi
          for want in "  - Docker container '$SWAP_CT' (stopped)" \
                      'Removed the leftover temporary copy.' \
                      'Restore cancelled. This restore did not change anything, but your DAAF data may still be' \
                      'incomplete from the earlier restore. Run the restore again to finish it.'; do
            if ! grep -qF -e "$want" "$log"; then echo "::error::Missing from the output: $want"; fails=1; fi
          done
          if grep -nE '^ERROR:' "$log"; then echo "::error::ERROR line in the output"; fails=1; fi
          if docker container inspect "$SWAP_CT" > /dev/null 2>&1; then echo "::error::$SWAP_CT still exists"; fails=1; fi
          for v in "$TEMP_VOL" "$CLAUDE_TEMP_VOL"; do
            if docker volume inspect "$v" > /dev/null 2>&1; then echo "::error::Temp volume $v still exists"; fails=1; fi
          done
          exit "$fails"

      # Helper-image check, backup side: with the pinned image gone, the backup must
      # download it (progress shown) and complete. Then `docker image inspect` by the
      # full name:tag@digest must exit 0 -- the compatibility audit's open question
      # (if it did not, every run would re-download, and an offline computer would be
      # refused).
      - name: "Image check: the backup downloads the missing pinned busybox"
        working-directory: daaf-docker
        timeout-minutes: 10
        run: |
          set -u
          log="$RUNNER_TEMP/backup_pull.log"
          docker image ls --digests busybox
          img_id=$(docker image inspect --format '{{.Id}}' "$BUSYBOX_IMAGE" 2>/dev/null || true)
          echo "Image ID before removal: ${img_id:-<inspect by the pinned reference failed>}"
          if [ -n "$img_id" ]; then
            mapfile -t users < <(docker ps -aq --filter "ancestor=$img_id" || true)
            if [ "${#users[@]}" -gt 0 ]; then docker rm -f "${users[@]}"; fi
            docker rmi "$BUSYBOX_IMAGE" || docker rmi -f "$img_id"
          fi
          if docker image inspect "$BUSYBOX_IMAGE" > /dev/null 2>&1; then
            echo "::error::Could not remove $BUSYBOX_IMAGE before the test"
            exit 1
          fi
          before=$(find . -maxdepth 1 -type d -name '*_daaf_backup' | wc -l)
          set +e
          bash backup_daaf.sh > "$log" 2>&1
          rc=$?
          set -e
          echo "backup exit code: $rc"; echo "----- captured -----"; cat "$log"; echo "--------------------"
          after=$(find . -maxdepth 1 -type d -name '*_daaf_backup' | wc -l)
          fails=0
          if [ "$rc" -ne 0 ]; then echo "::error::Expected exit 0, got $rc"; fails=1; fi
          if ! grep -qF 'Downloading the small helper image busybox that the backup needs...' "$log"; then
            echo "::error::The backup did not announce the helper-image download"; fails=1
          fi
          if ! grep -qE 'Backup complete!|Backup completed WITH WARNINGS' "$log"; then
            echo "::error::The backup did not complete"; fails=1
          elif grep -qF 'Backup completed WITH WARNINGS' "$log"; then
            echo "::warning::The backup completed WITH WARNINGS (see the output above)"
          fi
          if [ "$after" -ne $((before + 1)) ]; then echo "::error::Expected one new backup folder ($before -> $after)"; fails=1; fi
          if docker image inspect "$BUSYBOX_IMAGE" > /dev/null; then
            echo "OK: docker image inspect $BUSYBOX_IMAGE exits 0 after the pull"
            docker image inspect --format '{{.Id}} tags={{json .RepoTags}} digests={{json .RepoDigests}}' "$BUSYBOX_IMAGE"
          else
            echo "::error::docker image inspect by name:tag@digest fails after a pull: every run would re-download the helper image"
            fails=1
          fi
          exit "$fails"

      # Helper-image check, restore side: the download happens before the first
      # prompt. Answers: 1, no (cancel at RESTORE, so nothing is replaced).
      - name: "Image check: the restore downloads the missing pinned busybox before any prompt"
        working-directory: daaf-docker
        timeout-minutes: 10
        run: |
          set -u
          log="$RUNNER_TEMP/restore_pull.log"
          img_id=$(docker image inspect --format '{{.Id}}' "$BUSYBOX_IMAGE" 2>/dev/null || true)
          echo "Image ID before removal: ${img_id:-<inspect by the pinned reference failed>}"
          if [ -n "$img_id" ]; then
            mapfile -t users < <(docker ps -aq --filter "ancestor=$img_id" || true)
            if [ "${#users[@]}" -gt 0 ]; then docker rm -f "${users[@]}"; fi
            docker rmi "$BUSYBOX_IMAGE" || docker rmi -f "$img_id"
          fi
          if docker image inspect "$BUSYBOX_IMAGE" > /dev/null 2>&1; then
            echo "::error::Could not remove $BUSYBOX_IMAGE before the test"
            exit 1
          fi
          printf '1\nno\n' > "$RUNNER_TEMP/answers_restore_pull"
          set +e
          bash restore_from_backup.sh < "$RUNNER_TEMP/answers_restore_pull" > "$log" 2>&1
          rc=$?
          set -e
          echo "restore exit code: $rc"; echo "----- captured -----"; cat "$log"; echo "--------------------"
          fails=0
          if [ "$rc" -ne 0 ]; then echo "::error::Expected exit 0, got $rc"; fails=1; fi
          for want in 'Downloading the small helper image busybox that the restore needs...' \
                      'Restore cancelled. Your DAAF data has not been changed.'; do
            if ! grep -qF -e "$want" "$log"; then echo "::error::Missing from the output: $want"; fails=1; fi
          done
          dl=$(grep -nF 'Downloading the small helper image busybox' "$log" | head -n 1 | cut -d: -f1 || true)
          list=$(grep -nF 'Available backups (newest first):' "$log" | head -n 1 | cut -d: -f1 || true)
          if [ -z "$dl" ] || [ -z "$list" ] || [ "$dl" -ge "$list" ]; then
            echo "::error::The download did not come before the backup list (lines ${dl:-none} / ${list:-none})"; fails=1
          fi
          if ! docker image inspect "$BUSYBOX_IMAGE" > /dev/null; then
            echo "::error::docker image inspect by name:tag@digest fails after the restore's pull"; fails=1
          fi
          for v in "$TEMP_VOL" "$CLAUDE_TEMP_VOL"; do
            if docker volume inspect "$v" > /dev/null 2>&1; then echo "::error::Temp volume $v still exists"; fails=1; fi
          done
          exit "$fails"

      # --- Cleanup ---
      # Removes only what this job created, by exact name: the holder, the two swap
      # container names, the containers holding the two temp volumes, those volumes,
      # then the compose project (as in the other jobs). Never a prune.
      - name: Docker cleanup
        if: always()
        run: |
          if [ -d daaf-docker ]; then
            cd daaf-docker
            docker rm -f ci_restore_holder > /dev/null 2>&1 || true
            for c in "${SWAP_CT:-}" "${CLAUDE_SWAP_CT:-}"; do
              if [ -n "$c" ]; then docker rm -f "$c" > /dev/null 2>&1 || true; fi
            done
            for v in "${TEMP_VOL:-}" "${CLAUDE_TEMP_VOL:-}"; do
              if [ -n "$v" ]; then
                docker ps -aq --filter "volume=$v" | xargs -r docker rm -f > /dev/null 2>&1 || true
                docker volume rm "$v" > /dev/null 2>&1 || true
              fi
            done
            docker compose down -v --rmi local --remove-orphans
          fi
