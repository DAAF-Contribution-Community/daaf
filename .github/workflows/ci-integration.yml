# CI: Docker Integration Tests
#
# End-to-end tests for DAAF's host lifecycle scripts running against a real
# Docker daemon. Verifies install, run, backup, update, rebuild, and migrate
# workflows behave correctly with actual containers and volumes.
#
# Companion workflow: ci-scripts.yml handles lint, unit tests, and cross-platform
# dry-run smoke tests (no Docker required).
#
# Three jobs:
#   1. lifecycle-test  - Full lifecycle: install -> run -> backup -> update -> rebuild
#   2. migrate-era1    - Migration of clone-based installations (origin remote present)
#   3. migrate-era2    - Migration of ZIP-based installations (no remote, requires graft)
#
# Not tested here:
#   - view_logs.sh/ps1: Invokes `docker compose logs --follow`, which is a
#     blocking/streaming command unsuitable for CI. Covered by dry-run smoke
#     tests in ci-scripts.yml.
#   - Windows Docker integration: GitHub-hosted Windows runners have Docker
#     configured for Windows containers, not Linux containers. DAAF uses Linux
#     containers. Windows PowerShell logic is covered by the dry-run smoke
#     tests in ci-scripts.yml.
#
# Triggers: weekly (Sunday 6 AM UTC), manual dispatch, release tags.
# All jobs run on ubuntu-latest with a 30-minute timeout.

name: CI - Integration

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6 AM UTC
  workflow_dispatch: {}
  push:
    tags: ['v*']  # Run on release tags
    branches: [minor_revisions_v202]  # TEMPORARY: remove after confirming tests pass

permissions:
  contents: read

# DAAF_BRANCH tells all lifecycle scripts which branch to download from and
# target. Resolves to the branch name for schedule/dispatch, or the tag name
# for release-tag pushes (git treats tags as valid refs for --branch).
# DAAF_NESTED suppresses the interactive pause-before-exit in all scripts.
env:
  DAAF_BRANCH: ${{ github.ref_name }}
  DAAF_NESTED: "1"

# ---------------------------------------------------------------------------
# Job 1: Full lifecycle — install, run, backup, update, rebuild
# ---------------------------------------------------------------------------
# Exercises the standard user journey: install DAAF from scratch, verify the
# container is operational, run a command inside it, create a backup, attempt
# an update (no-op on fresh install), rebuild the image, and confirm
# everything still works afterward.
jobs:
  lifecycle-test:
    name: Lifecycle Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Install ---
      # install.sh creates daaf-docker/ in the current working directory,
      # downloads docker-compose.yml, Dockerfile, and all host scripts there,
      # builds the Docker image, and clones the repo into the container.
      - name: Install DAAF via install.sh
        run: bash scripts/host/install.sh

      # --- Verify container is running ---
      # install.sh has its own readiness wait, but add a retry loop as a
      # safety net for slow CI runners. docker compose ps shows "Up" in the
      # STATUS column (not "running").
      - name: Verify container is running
        working-directory: daaf-docker
        run: |
          for i in 1 2 3 4 5; do
            docker compose ps | grep -q "Up" && exit 0
            echo "Waiting for container to be ready (attempt $i/5)..."
            sleep 3
          done
          echo "ERROR: Container did not reach running state"
          docker compose ps
          exit 1

      # --- Verify CLAUDE.md exists in the container ---
      - name: Verify CLAUDE.md present in container
        working-directory: daaf-docker
        run: docker compose exec -T daaf-docker test -f /daaf/CLAUDE.md

      # --- Run a quick command inside the container ---
      # Uses the downloaded copy of run_daaf.sh (as a real user would).
      - name: Run test command via run_daaf.sh
        working-directory: daaf-docker
        run: bash run_daaf.sh echo "DAAF is working"

      # --- Backup ---
      - name: Create backup via backup_daaf.sh
        working-directory: daaf-docker
        run: bash backup_daaf.sh

      # backup_daaf.sh creates YYYY-MM-DD_daaf_backup/ in the current directory
      - name: Verify backup directory was created
        working-directory: daaf-docker
        run: ls -la *_daaf_backup/

      # --- Update (no-op on fresh install) ---
      - name: Run update_daaf.sh (no-op on fresh install)
        working-directory: daaf-docker
        run: bash update_daaf.sh

      - name: Verify container running after update
        working-directory: daaf-docker
        run: docker compose ps | grep -q "Up"

      # --- Simulate user work-in-progress ---
      # Add a committed file and an uncommitted file to verify that rebuild
      # preserves user data. Placed after update (which is a no-op on a fresh
      # install) so the local commit doesn't trigger update's interactive
      # prompt_choice for "ahead" branches.
      - name: Add committed research file
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            mkdir -p /daaf/research
            echo "My analysis notes" > /daaf/research/local_work.txt
            git -C /daaf add research/local_work.txt
            git -C /daaf commit -m "Local research work"
          '

      - name: Add uncommitted file edit
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            echo "Work in progress" > /daaf/research/uncommitted_draft.txt
          '

      # --- Rebuild ---
      - name: Rebuild image via rebuild_daaf.sh
        working-directory: daaf-docker
        run: bash rebuild_daaf.sh

      # --- Post-rebuild verification ---
      - name: Verify container running after rebuild
        working-directory: daaf-docker
        run: docker compose ps | grep -q "Up"

      - name: Verify CLAUDE.md present after rebuild
        working-directory: daaf-docker
        run: docker compose exec -T daaf-docker test -f /daaf/CLAUDE.md

      # --- Verify user work survived rebuild ---
      - name: Verify committed file preserved after rebuild
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "My analysis notes" /daaf/research/local_work.txt
            git -C /daaf log --oneline -1 | grep -q "Local research work"
          '

      - name: Verify uncommitted file preserved after rebuild
        working-directory: daaf-docker
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "Work in progress" /daaf/research/uncommitted_draft.txt
          '

      # --- Cleanup ---
      # Use conditional directory check because install.sh may not have created
      # daaf-docker/ if it failed early.
      - name: Docker cleanup
        if: always()
        run: |
          if [ -d daaf-docker ]; then
            cd daaf-docker
            docker compose down -v --rmi local --remove-orphans
          fi

  # ---------------------------------------------------------------------------
  # Job 2: Migration — Era 1 (clone-based installation)
  # ---------------------------------------------------------------------------
  # Simulates how Era 1 users actually installed DAAF: they ran git clone
  # directly, then docker compose up. No install.sh existed yet. The container
  # has /daaf populated via git clone with origin configured.
  # migrate_daaf.sh should detect "clone-based installation" and succeed.
  # The second run tests idempotency.
  migrate-era1:
    name: Migrate (Era 1 - Clone)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Simulate Era 1 installation (git clone + docker compose up) ---
      # Era 1 users cloned the repo on their host, then ran docker compose up.
      # We replicate this by: (1) building the container from the repo's
      # Dockerfile/docker-compose.yml, then (2) git cloning inside the container
      # (exactly what Era 1 users' startup process did).
      - name: Build and start container
        run: docker compose up -d --build

      - name: Wait for container readiness
        run: |
          for i in 1 2 3 4 5; do
            docker compose ps | grep -q "Up" && exit 0
            sleep 3
          done
          echo "ERROR: Container not ready"; docker compose ps; exit 1

      - name: Populate /daaf via git clone (Era 1 method)
        run: |
          docker compose exec -T daaf-docker \
            git clone --depth 1 -b "$DAAF_BRANCH" \
            "https://github.com/DAAF-Contribution-Community/daaf.git" /tmp/daaf-clone
          docker compose exec -T daaf-docker \
            bash -c 'cp -a /tmp/daaf-clone/. /daaf/ && rm -rf /tmp/daaf-clone'

      - name: Verify DAAF files present
        run: docker compose exec -T daaf-docker test -f /daaf/CLAUDE.md

      # --- Simulate user work-in-progress ---
      - name: Add committed research file
        run: |
          docker compose exec -T daaf-docker bash -c '
            mkdir -p /daaf/research
            echo "My analysis notes" > /daaf/research/local_work.txt
            git -C /daaf add research/local_work.txt
            git -C /daaf commit -m "Local research work"
          '

      - name: Add uncommitted file edit
        run: |
          docker compose exec -T daaf-docker bash -c '
            echo "Work in progress" > /daaf/research/uncommitted_draft.txt
          '

      # migrate_daaf.sh discovers the container via the daaf_daaf-data volume.
      # It needs docker-compose.yml in the current directory to run backup.
      - name: Run migrate_daaf.sh (should detect Era 1)
        run: bash scripts/host/migrate_daaf.sh

      # Verify origin remote is configured and points to the repo
      - name: Verify origin remote is configured
        run: docker compose exec -T daaf-docker git -C /daaf remote -v

      # Verify fetch works (future updates will succeed)
      - name: Verify git fetch origin succeeds
        run: docker compose exec -T daaf-docker git -C /daaf fetch origin

      # Run again to confirm idempotency — should succeed without errors
      - name: Run migrate_daaf.sh again (idempotency check)
        run: bash scripts/host/migrate_daaf.sh

      # --- Verify user work survived migration ---
      - name: Verify committed file preserved after migration
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "My analysis notes" /daaf/research/local_work.txt
            git -C /daaf log --oneline | grep -q "Local research work"
          '

      - name: Verify uncommitted file preserved after migration
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "Work in progress" /daaf/research/uncommitted_draft.txt
          '

      # --- Cleanup ---
      - name: Docker cleanup
        if: always()
        run: docker compose down -v --rmi local --remove-orphans

  # ---------------------------------------------------------------------------
  # Job 3: Migration — Era 2 (ZIP-based installation, no remote)
  # ---------------------------------------------------------------------------
  # Simulates how Era 2 users actually installed DAAF: they downloaded a ZIP
  # from GitHub, extracted it, and ran docker compose up. No git remote exists.
  # The container has DAAF files with local git history but no origin.
  # migrate_daaf.sh should detect "ZIP-based installation", add origin, fetch
  # upstream history, and graft local history onto it.
  migrate-era2:
    name: Migrate (Era 2 - ZIP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Simulate Era 2 installation (ZIP extraction + docker compose up) ---
      # Era 2 users downloaded a ZIP, extracted it, and ran docker compose up.
      # We replicate this by: (1) building the container, then (2) copying the
      # repo files WITHOUT .git into the container, then (3) initializing a
      # fresh local git repo (as the Dockerfile's entrypoint would have done).
      - name: Build and start container
        run: docker compose up -d --build

      - name: Wait for container readiness
        run: |
          for i in 1 2 3 4 5; do
            docker compose ps | grep -q "Up" && exit 0
            sleep 3
          done
          echo "ERROR: Container not ready"; docker compose ps; exit 1

      - name: Populate /daaf without .git (ZIP simulation)
        run: |
          tar --exclude='.git' -cf - . \
            | docker compose exec -T daaf-docker tar -xf - -C /daaf/

      - name: Initialize local git repo (as ZIP users would have)
        run: |
          docker compose exec -T daaf-docker bash -c '
            cd /daaf
            git init
            git add -A
            git commit -m "Initial DAAF installation"
          '

      - name: Verify no remote exists
        run: |
          output=$(docker compose exec -T daaf-docker git -C /daaf remote -v 2>&1 || true)
          if echo "$output" | grep -q "origin"; then
            echo "ERROR: origin remote should not exist in ZIP simulation"
            exit 1
          fi
          echo "Confirmed: no origin remote (ZIP simulation correct)"

      - name: Verify DAAF files present
        run: docker compose exec -T daaf-docker test -f /daaf/CLAUDE.md

      # --- Simulate user work-in-progress ---
      - name: Add committed research file
        run: |
          docker compose exec -T daaf-docker bash -c '
            mkdir -p /daaf/research
            echo "My analysis notes" > /daaf/research/local_work.txt
            git -C /daaf add research/local_work.txt
            git -C /daaf commit -m "Local research work"
          '

      - name: Add uncommitted file edit
        run: |
          docker compose exec -T daaf-docker bash -c '
            echo "Work in progress" > /daaf/research/uncommitted_draft.txt
          '

      # Run migrate — should detect Era 2, add origin, fetch, and graft
      - name: Run migrate_daaf.sh (should detect Era 2)
        run: bash scripts/host/migrate_daaf.sh

      # Verify origin was added
      - name: Verify origin remote was added
        run: docker compose exec -T daaf-docker git -C /daaf remote -v | grep origin

      # Verify fetch works (graft connected the histories)
      - name: Verify git fetch origin succeeds
        run: docker compose exec -T daaf-docker git -C /daaf fetch origin

      # Run again to confirm idempotency — graft already in place
      - name: Run migrate_daaf.sh again (idempotency check)
        run: bash scripts/host/migrate_daaf.sh

      # --- Verify user work survived migration ---
      - name: Verify committed file preserved after migration
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "My analysis notes" /daaf/research/local_work.txt
            git -C /daaf log --oneline | grep -q "Local research work"
          '

      - name: Verify uncommitted file preserved after migration
        run: |
          docker compose exec -T daaf-docker bash -c '
            grep -q "Work in progress" /daaf/research/uncommitted_draft.txt
          '

      # --- Cleanup ---
      - name: Docker cleanup
        if: always()
        run: docker compose down -v --rmi local --remove-orphans
