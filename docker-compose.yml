services:
  daaf-docker:
    build: .
    ports:
      - "2718:2718"   # Marimo notebook server
    volumes:
      - daaf-data:/daaf
    working_dir: /daaf
    stdin_open: true  # Required for interactive Claude Code sessions
    tty: true
    cap_drop:
      - ALL             # Drop all Linux capabilities (least privilege)
    security_opt:
      - no-new-privileges:true  # Prevent privilege escalation inside container

volumes:
  daaf-data:            # Docker-managed volume (ext4 filesystem)
